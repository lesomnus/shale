edition = "2023";

package shale;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/shale/api";

// RelayIngest is the one stream a producer keeps to its relay (§35.8, §39.3).
// The producer dials; the relay says which sources to send and when to stop.
service RelayIngest {
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);
}

message AttachRequest {
  // Hello once, then Data for every source the relay has started.
  message Hello {
    string publish_token = 1;
  }
  message Data {
    bytes source_id = 1;
    // fMP4 init or complete fragment. Each incarnation starts at a keyframe.
    bytes payload = 2;
    string capture_epoch = 3;
    // When the producer had the payload from its capture (t1) and when it
    // handed it to this stream (t2), on the producer's clock (§39.3). The
    // relay measures the producer's queue and the uplink from them; a
    // producer that predates them sends neither.
    google.protobuf.Timestamp read_at = 4;
    google.protobuf.Timestamp sent_at = 5;
  }
  // Reliable source control, independent of the bounded lossy media queue.
  message Reset {
    bytes source_id = 1;
    string capture_epoch = 2;
    bool stopped = 3;
  }
  oneof message {
    Hello hello = 1;
    Data data = 2;
    Reset reset = 3;
  }
}

message AttachResponse {
  message Start {
    bytes source_id = 1;
  }
  message Stop {
    bytes source_id = 1;
  }
  // Answered to Hello: which of the token's sources the relay accepted.
  message Welcome {
    repeated bytes sources = 1;
  }
  oneof message {
    Start start = 1;
    Stop stop = 2;
    Welcome welcome = 3;
  }
}
