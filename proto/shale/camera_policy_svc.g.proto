edition = "2023";
package shale;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "shale/camera.proto";
import "shale/camera_bootstrap.proto";
import "shale/camera_policy.proto";
import "shale/camera_preset_svc.g.proto";
import "shale/camera_svc.g.proto";
import "shale/payday/tenant_svc.g.proto";
import "shale/site_svc.g.proto";

option go_package = "github.com/lesomnus/shale/api";

service CameraPolicyService {
  // Add creates a new CameraPolicy
  rpc Add(CameraPolicyAddRequest) returns (CameraPolicy);
  // Get retrieves a CameraPolicy
  rpc Get(CameraPolicyGetRequest) returns (CameraPolicy);
  // List reads CameraPolicys a page at a time.
  rpc List(CameraPolicyListRequest) returns (CameraPolicyListResponse);
  // Watch the CameraPolicys this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**: an item is the whole of a row
  // as this caller's Get reads it when the item is sent, and a client replaces
  // what it held of that row. An item is sent when a write touches a row the
  // stream is about, so a row erased, or taken out of this caller's sight by a
  // write, arrives with no value. A row that leaves this caller's sight with no
  // write to it -- what they may see changed, not the row -- is not said, and a
  // client goes on holding it for as long as the stream is open.
  //
  // A stream that cannot keep up is ended, and is not let skip: an open stream
  // has missed nothing. One that ended has, and asking again is how it is put
  // right, since the first message of the new one is everything that matches
  // then; a row that stopped matching in between is in no message of either.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless, since each is the whole row.
  rpc Watch(CameraPolicyWatchRequest) returns (stream CameraPolicyWatchResponse);
  rpc Create(CameraPolicyCreateRequest) returns (CameraPolicy);
  rpc Activate(CameraPolicyActivateRequest) returns (CameraNetwork);
  // Explicit reapply creates a new pinned job against the same binding/Source.
  rpc Enroll(CameraPolicyEnrollRequest) returns (CameraJob);
  // Scoped observations never grant general inventory mutation or credentials.
  rpc Observe(CameraPolicyObserveRequest) returns (CameraPolicyObserveResponse);
  // First trust is available only before any binding, job, or camera secret.
  rpc TrustFactoryTLS(CameraPolicyTrustFactoryTLSRequest) returns (CameraPolicyObserveResponse);
  // Approves the key a job stopped on: a new policy revision with that
  // device's key, activated by network CAS, and a job that continues with it.
  rpc ApproveTLS(CameraPolicyApproveTLSRequest) returns (CameraPolicyApproveTLSResponse);
  // The assigned Worker's credential-free verification of a moved camera's
  // transport candidate, rechecked against today's fences in one transaction.
  rpc VerifyTransport(CameraPolicyVerifyTransportRequest) returns (CameraPolicyObserveResponse);
  // The assigned Worker's credential-free reading of a device's own clock at
  // one of its authorized endpoints. It records the reading on the device and
  // sets nothing on the camera; only a job's preset time_sync sets a clock.
  rpc ObserveClock(CameraPolicyObserveClockRequest) returns (CameraDevice);
}

message CameraPolicyAddRequest {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
  TenantRef tenant = 2;
  SiteRef site = 3;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  CameraNetworkRef network = 8;
  string policy_key = 9 [features.field_presence = IMPLICIT];
  string revision = 10 [features.field_presence = IMPLICIT];
  CameraPresetRef preset = 11;
  CameraEnrollmentPolicy enrollment = 12;
  google.protobuf.Timestamp date_created = 15;
}

message CameraPolicyGetRequest {
  CameraPolicyRef ref = 1;
  CameraPolicySelect select = 2;
}

message CameraPolicyRef {
  oneof key {
    bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
    CameraPolicyRefByRevision revision = 2;
  }
}

message CameraPolicyRefByRevision {
  TenantRef tenant = 2;
  string policy_key = 9;
  string revision = 10;
}

message CameraPolicySelect {
  bool all = 1;
  TenantSelect tenant = 2;
  SiteSelect site = 3;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  CameraNetworkSelect network = 8;
  bool policy_key = 9;
  bool revision = 10;
  CameraPresetSelect preset = 11;
  bool enrollment = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message CameraPolicyListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated CameraPolicyFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];

  // Which fields of each row to answer with, and which edges filled and how
  // deep, as a Get's select says it. Unset is what a list answers without
  // one. Each row is read as a Get of it with this select would read it, each
  // edge through what the caller may see of its entity; a list costs one
  // read for the rows and one for each edge selected, at any depth, however
  // many rows the page holds.
  //
  // Field 6 in every entity: 5 is the order's, declared or not.
  CameraPolicySelect select = 6;
}

message CameraPolicyListResponse {
  repeated CameraPolicy items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message CameraPolicyFilter {
  CameraPolicyRef ref = 1;
  TenantRef tenant = 2;
  SiteRef site = 3;
  CameraNetworkRef network = 4;
}

message CameraPolicyWatchRequest {
  // Which rows to watch, each named by its filter's ref. A filter that names
  // no row is refused, though List takes it: what a stream is about is the
  // rows its filters name, resolved once when it opens, and not what a List
  // of the same filters would answer later. The first message is that List's
  // answer now.
  //
  // Required, and bounded as a List's filters are. A watch with no filters
  // would be the whole table, forever, which is the one shape that has no cap
  // at all.
  repeated CameraPolicyFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message CameraPolicyWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated CameraPolicyWatchItem items = 1;
}

message CameraPolicyWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see** as a write to it left it: erased, or out of this caller's sight.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news. And only of a row a write touched: a row that
  // left this caller's sight because what they may see changed is not said.
  CameraPolicy value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message CameraPolicyCreateRequest {
  CameraNetworkRef network = 1;
  CameraPresetRef preset = 2;
  string policy_key = 3 [features.field_presence = IMPLICIT];
  string revision = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  CameraEnrollmentPolicy enrollment = 6;
}

message CameraPolicyActivateRequest {
  CameraPolicyRef ref = 1;
  google.protobuf.Timestamp expected_network_version = 2;
}

message CameraPolicyEnrollRequest {
  CameraBindingRef binding = 1;
  CameraPolicyRef policy = 2;
  string request_key = 3 [features.field_presence = IMPLICIT];
}

message CameraPolicyObserveRequest {
  CameraAssignmentRef assignment = 1;
  int64 assignment_generation = 2 [features.field_presence = IMPLICIT];
  // A discovery deduplication hint, never authenticated inventory ownership.
  string discovery_id = 3 [features.field_presence = IMPLICIT];
  CameraIdentityEvidence identity = 4;
  repeated CameraObservedEndpoint endpoints = 5;
}

message CameraPolicyObserveResponse {
  CameraDevice device = 1;
  CameraBinding binding = 2;
  CameraJob job = 3;
  string code = 4 [features.field_presence = IMPLICIT];
  CameraFactoryTLSPlan factory_tls_plan = 5;
  // A moved camera the assigned Worker may verify; old Workers ignore it and
  // the candidate stays on the operator path.
  CameraTransportGrant transport_grant = 6;
}

message CameraPolicyTrustFactoryTLSRequest {
  CameraFactoryTLSPlan plan = 1;
  CameraDeviceTLSIdentity identity = 2;
  // The assigned Worker's credential-free known factory challenge observed
  // that the initial administrator password is still unset.
  bool activation_required = 3 [features.field_presence = IMPLICIT];
}

message CameraPolicyApproveTLSRequest {
  // The job that stopped on a changed key. Its binding's device is the only
  // device the approval names.
  CameraJobRef ref = 1;
  // Exactly the key that job recorded; any other key is refused.
  string spki_sha256 = 2 [features.field_presence = IMPLICIT];
  // The network's current dateUpdated, as for Activate.
  google.protobuf.Timestamp expected_network_version = 3;
}

message CameraPolicyApproveTLSResponse {
  // The active revision now approving the key, and its network.
  CameraPolicy policy = 1;
  CameraNetwork network = 2;
  // The job that replaces the stopped one, pinned to the approved key.
  CameraJob job = 3;
}

message CameraPolicyVerifyTransportRequest {
  // Exactly the grant the CP stored for the candidate.
  CameraTransportGrant grant = 1;
  // The key the candidate presented in a credential-free TLS handshake.
  string spki_sha256 = 2 [features.field_presence = IMPLICIT];
}

message CameraPolicyObserveClockRequest {
  CameraAssignmentRef assignment = 1;
  int64 assignment_generation = 2 [features.field_presence = IMPLICIT];
  // By ID: the device the scan placed at endpoint.
  CameraDeviceRef device = 3;
  // Where the clock was read: exactly one of the device's HTTP(S) endpoints.
  string endpoint = 4 [features.field_presence = IMPLICIT];
  CameraClockObservation clock = 5;
}
