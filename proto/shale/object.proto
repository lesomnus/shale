edition = "2023";

package shale;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "shale/host.proto";
import "shale/payday/tenant.proto";
import "shale/set.proto";
import "shale/site.proto";
import "shale/storage.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/shale/api";

// ObjectState is the object machine of §8.
enum ObjectState {
  OBJECT_STATE_UNSPECIFIED = 0;
  OBJECT_STATE_PENDING = 1;
  OBJECT_STATE_COMMITTED = 2;
  OBJECT_STATE_DELETING = 3;
  OBJECT_STATE_DELETED = 4;
  OBJECT_STATE_LOST = 5;
}

// Object is the immutable unit of storage, a video segment (§23). Its row is
// the index (§23.3); the truth lives in the sink's xattrs.
//
// Never erased through the API: GC moves it to DELETED and the row is pruned
// later by row retention (§20.4), which is a hard erase the CP performs.
message Object {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  Site site = 3 [(orm.edge) = {
    nullable: true
    immutable: true
  }];

  Set set = 8 [(orm.edge) = {immutable: true}];
  Source source = 9 [(orm.edge) = {immutable: true}];
  // The sink the object was committed to; null until then.
  Sink sink = 10 [(orm.edge) = {nullable: true}];
  // Path within the sink; with the sink, the object's location.
  string object_key = 11;
  ObjectState state = 12;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // Data time (§10): declared by the producer.
  google.protobuf.Timestamp date_started = 16 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_ended = 17 [(orm.field) = {nullable: true}];
  // date_ended is an estimate for an incomplete object (§19).
  bool ended_estimated = 18;
  int64 size = 19;
  bool incomplete = 20;
  google.protobuf.Timestamp date_expired = 21 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_deleted = 22 [(orm.field) = {nullable: true}];
  // False until the node has rewritten the xattr after a reschedule (§20.3).
  bool dates_synced = 23;
  int64 placement_version = 24;
  google.protobuf.Timestamp date_committed = 25 [(orm.field) = {nullable: true}];
  // When the object became DELETED or LOST, for row retention (§20.4).
  google.protobuf.Timestamp date_finished = 26 [(orm.field) = {nullable: true}];
  bytes checksum = 27 [(orm.field) = {default: ""}];
  // The epoch bucket date_started falls in, in seconds since the epoch, so
  // one index answers "the objects of this source in this epoch".
  int64 epoch = 28;

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "source_time"
        refs: [
          {name: "source", number: 9},
          {name: "date_started", number: 16}
        ]
      },
      {
        name: "set_time"
        refs: [
          {name: "set", number: 8},
          {name: "date_started", number: 16}
        ]
      },
      {
        name: "location"
        refs: [
          {name: "sink", number: 10},
          {name: "object_key", number: 11}
        ]
      },
      {
        name: "gc"
        refs: [
          {name: "sink", number: 10},
          {name: "date_expired", number: 21}
        ]
      },
      {
        name: "state"
        refs: [
          {name: "state", number: 12},
          {name: "date_finished", number: 26}
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 9
    erase: {hard: {}}
    list: {
      order: [
        {field: {name: "date_created"}},
        {field: {name: "id"}}
      ]
      by: [
        {name: "ref"},
        {name: "tenant"},
        {name: "set"},
        {name: "source"},
        {name: "sink"}
      ]
      size: 100
      max: 1000
    }
    watch: {}
  };
}

// AttemptState is the write-attempt machine of §8.
enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_ALLOCATED = 1;
  ATTEMPT_STATE_STORED = 2;
  ATTEMPT_STATE_FAILED = 3;
  ATTEMPT_STATE_ABANDONED = 4;
  ATTEMPT_STATE_DUPLICATE = 5;
}

// Attempt is one write attempt of an object: one candidate of one allocation
// (§8). FAILED and ABANDONED are the CP's guesses; a late ObjectStored still
// moves it to STORED or DUPLICATE (§14).
message Attempt {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  Site site = 3 [(orm.edge) = {
    nullable: true
    immutable: true
  }];

  Object object = 8 [(orm.edge) = {immutable: true}];
  Sink sink = 9 [(orm.edge) = {immutable: true}];
  // The node the sink was on when the attempt was allocated.
  Node node = 10 [(orm.edge) = {immutable: true}];
  AttemptState state = 11;
  string failure_reason = 12;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // The end of the allocation's TTL; the token expires with it.
  google.protobuf.Timestamp date_expires = 16 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_finished = 17 [(orm.field) = {nullable: true}];
  // Position in the allocation's ranking, 0 first.
  int32 rank = 18;

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "object"
        refs: [
          {name: "object", number: 8},
          {name: "date_created", number: 15}
        ]
      },
      {
        name: "open"
        refs: [
          {name: "state", number: 11},
          {name: "date_expires", number: 16}
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 10
    erase: {hard: {}}
    list: {
      order: [
        {field: {name: "date_created"}},
        {field: {name: "id"}}
      ]
      by: [
        {name: "ref"},
        {name: "tenant"},
        {name: "object"},
        {name: "sink"}
      ]
      size: 50
      max: 500
    }
  };
}
