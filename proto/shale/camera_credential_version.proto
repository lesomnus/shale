edition = "2023";

package shale;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "shale/payday/tenant.proto";
import "shale/site.proto";
import "shale/camera.proto";
import "shale/camera_credential.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/shale/api";

// An explicit mapping from an existing standalone reference. These strings
// preserve its original scope exactly; they never become a machine grant.
// Importing records this mapping without rotating the installed password or
// deleting the recoverable standalone copy.
message CameraLegacyCredentialReference {
  CameraCredentialReference ref = 1;
  string tenant_id = 2;
  string producer_id = 3;
  string network_id = 4;
  bool recoverable = 5;
  string site_id = 6;
  string set_id = 7;
}

enum CameraCredentialOrigin {
  CAMERA_CREDENTIAL_ORIGIN_UNSPECIFIED = 0;
  CAMERA_CREDENTIAL_ORIGIN_GENERATED = 1;
  CAMERA_CREDENTIAL_ORIGIN_IMPORTED = 2;
  CAMERA_CREDENTIAL_ORIGIN_REUSED = 3;
}

// CameraCredentialVersion records one durably prepared, immutable payload.
// Ordinary reads are metadata only: the generated Secret layer clears both
// secret columns on every CRUD response, List and Watch. Store code reads
// those columns through an explicit private query. Custom RPCs return their
// own reference/lease DTOs and must not echo an unredacted entity value.
message CameraCredentialVersion {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID key: true default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  Site site = 3 [(orm.edge) = {nullable: true immutable: true}];
  CameraCredential credential = 8 [(orm.edge) = {immutable: true}];
  string version = 9 [(orm.field) = {immutable: true}];
  string intent_key = 10 [(orm.field) = {immutable: true}];
  string access = 11 [(orm.field) = {immutable: true}];
  string backend = 12 [(orm.field) = {immutable: true}];
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true default: ""}];
  bytes sealed_envelope = 16 [
    (orm.field) = {immutable: true},
    (payday.field) = {secret: true}
  ];
  // Keyed replay tag for an import, never an unkeyed password digest.
  // Generated preparations do not have an import payload to compare.
  bytes import_tag = 17 [
    (orm.field) = {immutable: true nullable: true},
    (payday.field) = {secret: true}
  ];
  CameraCredentialOrigin origin = 18 [(orm.field) = {immutable: true}];
  google.protobuf.Timestamp date_revoked = 19 [(orm.field) = {nullable: true}];
  CameraLegacyCredentialReference legacy = 20 [(orm.field) = {immutable: true}];
  // Hash of nonsecret legacy reference/scope metadata, not its password.
  string legacy_key = 21 [(orm.field) = {immutable: true nullable: true}];
  CameraCredentialReference reused_from = 22 [(orm.field) = {immutable: true}];
  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {name: "page" refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]},
      // Version names, intents and imported references stay taken forever.
      {name: "version" refs: [{name: "version", number: 9}, {name: "credential", number: 8}] unique: true hidden: true includes_erased: true},
      {name: "intent" refs: [{name: "intent_key", number: 10}, {name: "credential", number: 8}] unique: true hidden: true includes_erased: true},
      {name: "legacy" refs: [{name: "legacy_key", number: 21}] unique: true hidden: true includes_erased: true}
    ]
  };
  option (payday.entity) = {
    domain: 33
    list: {
      order: [{field: {name: "date_created"}}, {field: {name: "id"}}]
      by: [{name: "ref"}, {name: "tenant"}, {name: "site"}, {name: "credential"}]
      size: 50 max: 500
    }
    watch: {}
  };
}
