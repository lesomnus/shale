edition = "2023";

package shale;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/shale/api";

// CertificateAuthorityState is a CA's place in a rollover (§33.5).
enum CertificateAuthorityState {
  CERTIFICATE_AUTHORITY_STATE_UNSPECIFIED = 0;
  // Made by a rollover: in the bundle every host receives, issuing nothing
  // until every live host holds that bundle.
  CERTIFICATE_AUTHORITY_STATE_NEXT = 1;
  // Issues host certificates and the CP's own; exactly one at a time.
  CERTIFICATE_AUTHORITY_STATE_ACTIVE = 2;
  // Replaced by a rollover: still in the bundle and still trusted, issuing
  // nothing, until no live host holds a certificate from it.
  CERTIFICATE_AUTHORITY_STATE_RETIRING = 3;
  // Dropped: in no bundle, trusted by nothing.
  CERTIFICATE_AUTHORITY_STATE_RETIRED = 4;
}

// CertificateAuthority is one of the CAs the CP's built-in PKI has had
// (§33.5). There are no rows until the first rollover: until then the CA
// `shale init` wrote into the state directory is the only one. A rollover
// records that one too, and from then on these rows are the CA set every
// CP process reads, the way SigningKey rows are the key set. The private
// half is stored wrapped by the KEK and never answered with.
message CertificateAuthority {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  string alias = 4 [(orm.field) = {unique: true}];
  string name = 5;
  string desc = 6;
  map<string, string> labels = 7;

  // PEM: the CA certificate, which is what goes into the bundle.
  bytes certificate = 8 [(orm.field) = {default: ""}];
  // The private key, wrapped by the KEK. Written, never answered with.
  bytes private_key = 9 [
    (orm.field) = {default: ""},
    (payday.field) = {secret: true}
  ];
  CertificateAuthorityState state = 10;
  // sha256:<hex> of the certificate's DER, the way `ca_hash` takes it.
  string fingerprint = 11;
  // When the CA certificate expires.
  google.protobuf.Timestamp date_expires = 12 [(orm.field) = {nullable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // When it began to issue, and when it was dropped.
  google.protobuf.Timestamp date_active = 16 [(orm.field) = {nullable: true}];
  google.protobuf.Timestamp date_retired = 17 [(orm.field) = {nullable: true}];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 42
    // `shale ca ...`
    name: "ca"
    global: {}
    list: {
      order: [
        {field: {name: "date_created"}},
        {field: {name: "id"}}
      ]
      by: [
        {name: "ref"}
      ]
      size: 20
      max: 100
    }
    watch: {}
  };
}
