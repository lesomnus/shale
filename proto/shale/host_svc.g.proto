  rpc Add(ReaderAddRequest) returns (Reader);
  // Get retrieves a Reader
  rpc Get(ReaderGetRequest) returns (Reader);
  // Patch updates an existing Reader
  rpc Patch(ReaderPatchRequest) returns (Reader);
  // Apply applies a patch document to an existing Reader
  rpc Apply(ReaderApplyRequest) returns (Reader);
  // Erase deletes a Reader
  rpc Erase(ReaderRef) returns (ReaderEraseResponse);
  // List reads Readers a page at a time.
  rpc List(ReaderListRequest) returns (ReaderListResponse);
  // Watch the Readers this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(ReaderWatchRequest) returns (stream ReaderWatchResponse);
  rpc Join(ReaderJoinRequest) returns (ReaderJoinResponse);
  rpc Adopt(ReaderAdoptRequest) returns (Reader);
  rpc RenewCertificate(ReaderRenewCertificateRequest) returns (ReaderRenewCertificateResponse);
  // Keeps date_seen current and reports the certificate serial.
  rpc Heartbeat(ReaderHeartbeatRequest) returns (ReaderHeartbeatResponse);
}

message NodeAddRequest {
  bytes id = 1;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  string hardware_id = 8 [features.field_presence = IMPLICIT];
  string hostname = 9 [features.field_presence = IMPLICIT];
  HostState state = 10 [features.field_presence = IMPLICIT];
  string cert_serial = 11 [features.field_presence = IMPLICIT];
  HostJoin join = 12;
  google.protobuf.Timestamp date_created = 15;
  google.protobuf.Timestamp date_adopted = 16;
  google.protobuf.Timestamp date_seen = 17;
  google.protobuf.Timestamp date_cert_expires = 18;
  repeated HostInterface interfaces = 19;
  repeated string key_ids = 20;
  string ca_hash = 21 [features.field_presence = IMPLICIT];
  string version = 22 [features.field_presence = IMPLICIT];
  string control_address = 23 [features.field_presence = IMPLICIT];
  string data_address = 24 [features.field_presence = IMPLICIT];
  NodeStatus status = 25;
  double failure_score = 26 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_scored = 27;
}

message NodeGetRequest {
