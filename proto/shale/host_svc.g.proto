option go_package = "github.com/lesomnus/shale/api";

service NodeService {
  // Add creates a new Node
  rpc Add(NodeAddRequest) returns (Node);
  // Get retrieves a Node
  rpc Get(NodeGetRequest) returns (Node);
  // Patch updates an existing Node
  rpc Patch(NodePatchRequest) returns (Node);
  // Apply applies a patch document to an existing Node
  rpc Apply(NodeApplyRequest) returns (Node);
  // Erase deletes a Node
  rpc Erase(NodeRef) returns (NodeEraseResponse);
  // List reads Nodes a page at a time.
  rpc List(NodeListRequest) returns (NodeListResponse);
  // Watch the Nodes this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(NodeWatchRequest) returns (stream NodeWatchResponse);
  // Hardware identity, hostname, interfaces, sinks, and CSR in; polled until
  // adopted; node_id, certificate, CA bundle, and key set out (§33.4).
  rpc Join(NodeJoinRequest) returns (NodeJoinResponse);
  // An operator accepts a pending node.
  rpc Adopt(NodeAdoptRequest) returns (Node);
  rpc RenewCertificate(NodeRenewCertificateRequest) returns (NodeRenewCertificateResponse);
  // Health, capacity, and pressure of the node, its devices, and its sinks
  // (§27).
  rpc Heartbeat(NodeHeartbeatRequest) returns (NodeHeartbeatResponse);
  // ObjectStored, ObjectDeleted, and ObjectMissing events, batched; applied
  // idempotently (§34.9).
  rpc PushEvents(NodePushEventsRequest) returns (NodePushEventsResponse);
  // What the active address resolver would hand out, for a given caller
  // (§34.10).
  rpc Resolve(NodeResolveRequest) returns (NodeResolveResponse);
}

service RelayService {
  // Add creates a new Relay
  rpc Add(RelayAddRequest) returns (Relay);
  // Get retrieves a Relay
  rpc Get(RelayGetRequest) returns (Relay);
  // Patch updates an existing Relay
  rpc Patch(RelayPatchRequest) returns (Relay);
  // Apply applies a patch document to an existing Relay
  rpc Apply(RelayApplyRequest) returns (Relay);
  // Erase deletes a Relay
  rpc Erase(RelayRef) returns (RelayEraseResponse);
  // List reads Relays a page at a time.
  rpc List(RelayListRequest) returns (RelayListResponse);
  // Watch the Relays this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(RelayWatchRequest) returns (stream RelayWatchResponse);
  rpc Join(RelayJoinRequest) returns (RelayJoinResponse);
  rpc Adopt(RelayAdoptRequest) returns (Relay);
  rpc RenewCertificate(RelayRenewCertificateRequest) returns (RelayRenewCertificateResponse);
  // Attached producers, active sources, viewers, egress, load (§39.2).
  rpc Heartbeat(RelayHeartbeatRequest) returns (RelayHeartbeatResponse);
  // An operator moves a producer to a relay; the assignment stays sticky.
  rpc Assign(RelayAssignRequest) returns (Relay);
}

service ProducerService {
  // Add creates a new Producer
  rpc Add(ProducerAddRequest) returns (Producer);
  // Get retrieves a Producer
  rpc Get(ProducerGetRequest) returns (Producer);
  // Patch updates an existing Producer
  rpc Patch(ProducerPatchRequest) returns (Producer);
  // Apply applies a patch document to an existing Producer
  rpc Apply(ProducerApplyRequest) returns (Producer);
  // Erase deletes a Producer
  rpc Erase(ProducerRef) returns (ProducerEraseResponse);
  // List reads Producers a page at a time.
  rpc List(ProducerListRequest) returns (ProducerListResponse);
  // Watch the Producers this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(ProducerWatchRequest) returns (stream ProducerWatchResponse);
  // Called without a credential by a host on its first run, and polled until
  // an admin adopts it: hardware identity, hostname, and CSR in; certificate
  // and CA bundle out once adopted (§33.4).
  rpc Join(ProducerJoinRequest) returns (ProducerJoinResponse);
  // A tenant admin accepts a pending producer and assigns its set.
  rpc Adopt(ProducerAdoptRequest) returns (Producer);
  // Called over mTLS before the certificate expires (§33.5).
  rpc RenewCertificate(ProducerRenewCertificateRequest) returns (ProducerRenewCertificateResponse);
  // Input state per source and host load, every producer_heartbeat_interval
  // (§38.6). The answer carries the current relay assignment (§39.2).
  rpc Heartbeat(ProducerHeartbeatRequest) returns (ProducerHeartbeatResponse);
  // The current relay assignment and a fresh publish token, on demand.
  rpc Relay(ProducerRelayRequest) returns (ProducerRelayResponse);
}

service ReaderService {
