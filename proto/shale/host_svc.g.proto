    bytes id = 1;
    string alias = 4;
  }
}

message NodeSelect {
  bool all = 1;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  bool hardware_id = 8;
  bool hostname = 9;
  bool state = 10;
  bool cert_serial = 11;
  bool join = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool date_adopted = 16;
  bool date_seen = 17;
  bool date_cert_expires = 18;
  bool interfaces = 19;
  bool key_ids = 20;
  bool ca_hash = 21;
  bool version = 22;
  bool control_address = 23;
  bool data_address = 24;
  bool status = 25;
  bool failure_score = 26;
  bool date_scored = 27;
}

message NodePatchRequest {
  NodeRef ref = 1;
  string alias = 8;
  string name = 10;
  string desc = 12;
  map<string, string> labels = 14;
  string hardware_id = 16;
  string hostname = 18;
  HostState state = 20;
  string cert_serial = 22;
  HostJoin join = 24;
  // Clear join instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and join clears.
  bool join_null = 25;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  google.protobuf.Timestamp date_adopted = 32;
  // Clear date_adopted instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_adopted clears.
  bool date_adopted_null = 33;
  google.protobuf.Timestamp date_seen = 34;
  // Clear date_seen instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_seen clears.
  bool date_seen_null = 35;
  google.protobuf.Timestamp date_cert_expires = 36;
  // Clear date_cert_expires instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_cert_expires clears.
  bool date_cert_expires_null = 37;
  repeated HostInterface interfaces = 38;
  repeated string key_ids = 40;
  string ca_hash = 42;
  string version = 44;
  string control_address = 46;
  string data_address = 48;
  NodeStatus status = 50;
  // Clear status instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and status clears.
  bool status_null = 51;
  double failure_score = 52;
  google.protobuf.Timestamp date_scored = 54;
  // Clear date_scored instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_scored clears.
  bool date_scored_null = 55;
}

message NodeApplyRequest {
  NodeRef ref = 1;
  patch.Patch patch = 2;
}

message NodeEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message NodeListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated NodeFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message NodeListResponse {
  repeated Node items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message NodeFilter {
  NodeRef ref = 1;
  map<string, string> labels = 2;
}

message NodeWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated NodeFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message NodeWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated NodeWatchItem items = 1;
}

message NodeWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Node value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message NodeJoinRequest {
  HostJoin host = 1;
  repeated HostInterface interfaces = 2;
  repeated SinkReport sinks = 3;
  repeated DeviceReport devices = 4;
  string control_address = 5 [features.field_presence = IMPLICIT];
  string data_address = 6 [features.field_presence = IMPLICIT];
}

message NodeJoinResponse {
  JoinAnswer answer = 1;
  repeated KeyEntry keys = 2;
}

// JoinAnswer is what every host's Join answers: pending, or adopted with the
// certificate.
message JoinAnswer {
  HostState state = 1 [features.field_presence = IMPLICIT];
  bytes id = 2 [features.field_presence = IMPLICIT];
  string alias = 3 [features.field_presence = IMPLICIT];
  // PEM: the host certificate, then the chain.
  bytes certificate = 4 [features.field_presence = IMPLICIT];
  // PEM: every CA a host must trust, the current and the next during a
  // rollover (§33.5).
  bytes ca_bundle = 5 [features.field_presence = IMPLICIT];
  string message = 6 [features.field_presence = IMPLICIT];
  bool rejoin = 7 [features.field_presence = IMPLICIT];
}

message NodeAdoptRequest {
  NodeRef ref = 1;
  string alias = 2 [features.field_presence = IMPLICIT];
}

message NodeRenewCertificateRequest {
  bytes csr = 1 [features.field_presence = IMPLICIT];
}

message NodeRenewCertificateResponse {
  bytes certificate = 1 [features.field_presence = IMPLICIT];
  bytes ca_bundle = 2 [features.field_presence = IMPLICIT];
}

message NodeHeartbeatRequest {
  string cert_serial = 1 [features.field_presence = IMPLICIT];
  string ca_hash = 2 [features.field_presence = IMPLICIT];
  repeated string key_ids = 3;
  repeated DeviceReport devices = 4;
  repeated SinkReport sinks = 5;
  repeated HostInterface interfaces = 6;
  string control_address = 7 [features.field_presence = IMPLICIT];
  string data_address = 8 [features.field_presence = IMPLICIT];
  string version = 9 [features.field_presence = IMPLICIT];
  int64 uploads_in_flight = 10 [features.field_presence = IMPLICIT];
  int64 index_objects = 11 [features.field_presence = IMPLICIT];
  repeated string warnings = 12;
}

message NodeHeartbeatResponse {
  repeated SinkAnswer sinks = 1;
  bool renew_certificate = 2 [features.field_presence = IMPLICIT];
}

// SinkAnswer is what the CP says back about each reported sink (§28.3).
message SinkAnswer {
  bytes sink_id = 1 [features.field_presence = IMPLICIT];
  SinkAttachment attachment = 2 [features.field_presence = IMPLICIT];
  // Whether this node may serve the sink: false while it is attached to
  // another node.
  bool serve = 3 [features.field_presence = IMPLICIT];
  bool accept_writes = 4 [features.field_presence = IMPLICIT];
}

message NodePushEventsRequest {
  repeated Event events = 1;
}

message NodePushEventsResponse {
  int32 applied = 1 [features.field_presence = IMPLICIT];
}

message NodeResolveRequest {
  NodeRef ref = 1;
  // The caller's address; the calling connection's when empty.
  string from = 2 [features.field_presence = IMPLICIT];
  string protocol = 3 [features.field_presence = IMPLICIT];
}

message NodeResolveResponse {
  repeated Endpoint endpoints = 1;
}

