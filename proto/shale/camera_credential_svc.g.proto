edition = "2023";
package shale;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "shale/camera.proto";
import "shale/camera_credential.proto";
import "shale/camera_credential_version.proto";
import "shale/camera_svc.g.proto";
import "shale/camera_worker_svc.g.proto";
import "shale/payday/tenant_svc.g.proto";
import "shale/set_svc.g.proto";
import "shale/site_svc.g.proto";

option go_package = "github.com/lesomnus/shale/api";

service CameraCredentialService {
  // Add creates a new CameraCredential
  rpc Add(CameraCredentialAddRequest) returns (CameraCredential);
  // Get retrieves a CameraCredential
  rpc Get(CameraCredentialGetRequest) returns (CameraCredential);
  // Patch updates an existing CameraCredential
  rpc Patch(CameraCredentialPatchRequest) returns (CameraCredential);
  // Apply applies a patch document to an existing CameraCredential
  rpc Apply(CameraCredentialApplyRequest) returns (CameraCredential);
  // Erase deletes a CameraCredential
  rpc Erase(CameraCredentialRef) returns (CameraCredentialEraseResponse);
  // List reads CameraCredentials a page at a time.
  rpc List(CameraCredentialListRequest) returns (CameraCredentialListResponse);
  // Watch the CameraCredentials this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(CameraCredentialWatchRequest) returns (stream CameraCredentialWatchResponse);
  rpc Prepare(CameraCredentialPrepareRequest) returns (CameraCredentialPrepared);
  rpc Import(CameraCredentialImportRequest) returns (CameraCredentialPrepared);
  rpc Resolve(CameraCredentialResolveRequest) returns (CameraCredentialLease);
  rpc Revoke(CameraCredentialRevokeRequest) returns (CameraCredentialRevokeResponse);
}

message CameraCredentialAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  SiteRef site = 3;
  CameraDeviceRef device = 8;
  CameraBindingRef binding = 9;
  string binding_key = 10 [features.field_presence = IMPLICIT];
  string purpose = 11 [features.field_presence = IMPLICIT];
  string current_version = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  google.protobuf.Timestamp date_revoked = 16;
}

message CameraCredentialGetRequest {
  CameraCredentialRef ref = 1;
  CameraCredentialSelect select = 2;
}

message CameraCredentialRef {
  oneof key {
    bytes id = 1;
    CameraCredentialRefBySubject subject = 8;
  }
}

message CameraCredentialRefBySubject {
  CameraDeviceRef device = 8;
  string binding_key = 10;
  string purpose = 11;
}

message CameraCredentialSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  SiteSelect site = 3;
  CameraDeviceSelect device = 8;
  CameraBindingSelect binding = 9;
  bool binding_key = 10;
  bool purpose = 11;
  bool current_version = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool date_revoked = 16;
}

message CameraCredentialPatchRequest {
  CameraCredentialRef ref = 1;
  string current_version = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  google.protobuf.Timestamp date_revoked = 32;
  // Clear date_revoked instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_revoked clears.
  bool date_revoked_null = 33;
}

message CameraCredentialApplyRequest {
  CameraCredentialRef ref = 1;
  patch.Patch patch = 2;
}

message CameraCredentialEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message CameraCredentialListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated CameraCredentialFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];
}

message CameraCredentialListResponse {
  repeated CameraCredential items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message CameraCredentialFilter {
  CameraCredentialRef ref = 1;
  TenantRef tenant = 2;
  SiteRef site = 3;
  CameraDeviceRef device = 4;
  CameraBindingRef binding = 5;
}

message CameraCredentialWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated CameraCredentialFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message CameraCredentialWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated CameraCredentialWatchItem items = 1;
}

message CameraCredentialWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  CameraCredential value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

// These are explicit secret-transfer operations, not ordinary inventory CRUD.
// Handlers decode raw material directly into a redacted in-process value; raw
// request/response protobufs are never status, audit, log or Source DTOs.
message CameraCredentialPrepareRequest {
  CameraDeviceRef device = 1;
  CameraBindingRef binding = 2;
  string purpose = 3 [features.field_presence = IMPLICIT];
  string intent_key = 4 [features.field_presence = IMPLICIT];
  // Empty selects the configured initial-administrator username (admin).
  bytes username = 5 [features.field_presence = IMPLICIT];
  string access = 6 [features.field_presence = IMPLICIT];
  // Copy an already installed account into another explicit delivery purpose.
  CameraCredentialReference reuse = 7;
}

// Preparation returns references only. The enclosing transaction has committed
// before an RPC response makes these recoverable references available to a
// Worker. A policy's internal preparation and Job.Create share that transaction.
message CameraCredentialPrepared {
  CameraCredentialReference credential = 1;
  bytes device_id = 2;
  bytes binding_id = 3;
  string access = 4 [features.field_presence = IMPLICIT];
  CameraCredentialOrigin origin = 5 [features.field_presence = IMPLICIT];
  string backend = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 7;
  bool revoked = 8 [features.field_presence = IMPLICIT];
}

message CameraCredentialImportRequest {
  CameraDeviceRef device = 1;
  CameraBindingRef binding = 2;
  string purpose = 3 [features.field_presence = IMPLICIT];
  string intent_key = 4 [features.field_presence = IMPLICIT];
  string access = 5 [features.field_presence = IMPLICIT];
  // Explicit lossless Material binary, not JSON username/password strings.
  bytes material = 6 [features.field_presence = IMPLICIT];
  CameraCredentialReference expected_current = 7;
  CameraLegacyCredentialReference legacy = 8;
}

message CameraCredentialResolveRequest {
  CameraCredentialReference credential = 1;
  // Required for Workers; exact pinned JobInputs purpose/reference only.
  CameraWorkerCheckJobRequest job = 2;
  // Producer streaming delivery is bound to this current assigned Source.
  // A binding-specific reference may identify it without this optional field.
  SourceRef source = 3;
  // Zero disables an offline streaming cache grant. Workers cannot request it.
  int64 cache_seconds = 4 [features.field_presence = IMPLICIT];
  int64 lease_seconds = 5 [features.field_presence = IMPLICIT];
  int64 source_revision = 6 [features.field_presence = IMPLICIT];
  string access = 7 [features.field_presence = IMPLICIT];
}

message CameraCredentialLease {
  // Plaintext only on this authenticated, explicitly requested transfer.
  bytes material = 1 [features.field_presence = IMPLICIT];
  CameraCredentialReference credential = 2;
  google.protobuf.Timestamp expires = 3;
  CameraCredentialDelivery delivery = 4;
  // A cache grant does not attest that capture applied the source. The client
  // additionally requires its own matching applied-state acknowledgement.
  google.protobuf.Timestamp cache_until = 5;
  string access = 6 [features.field_presence = IMPLICIT];
}

// Current delivery metadata is deliberately separate from the immutable secret
// identity/AAD, so a separately adopted replacement machine can recover it.
message CameraCredentialDelivery {
  bytes tenant_id = 1;
  bytes site_id = 2;
  bytes set_id = 3;
  bytes producer_id = 4;
  bytes network_id = 5;
  bytes device_id = 6;
  bytes binding_id = 7;
  bytes source_id = 8;
  bytes assignment_id = 9;
  int64 assignment_generation = 10 [features.field_presence = IMPLICIT];
  int64 source_revision = 11 [features.field_presence = IMPLICIT];
  int64 lease_generation = 12 [features.field_presence = IMPLICIT];
  bytes job_id = 13;
}

message CameraCredentialRevokeRequest {
  CameraCredentialReference credential = 1;
}

message CameraCredentialRevokeResponse {}
