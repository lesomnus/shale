edition = "2023";

package shale;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "shale/payday/tenant.proto";
import "shale/site.proto";
import "shale/camera.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/shale/api";

// CameraCredential is the stable identity of a camera account purpose. Its
// identity does not change when an approved Worker or Producer is replaced.
// Delivery is authorized against the current assignment, never by this row or
// a reference alone. Generic mutations are not a credential-store interface.
message CameraCredential {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID key: true default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  Site site = 3 [(orm.edge) = {nullable: true immutable: true}];
  // 4..7 remain empty: credentials have references, not user-chosen aliases.
  CameraDevice device = 8 [(orm.edge) = {immutable: true}];
  CameraBinding binding = 9 [(orm.edge) = {nullable: true immutable: true}];
  // Canonical binding UUID, or "device" for a device-wide account. This gives
  // device-wide subjects the same uniqueness guarantee as bound subjects;
  // SQL NULLs in an optional binding edge cannot supply that guarantee.
  string binding_key = 10 [(orm.field) = {immutable: true}];
  // initial_admin is always device-wide. Purpose describes CP delivery, not
  // proof of separate physical-camera accounts or firmware permissions.
  string purpose = 11 [(orm.field) = {immutable: true}];
  string current_version = 12;
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true default: ""}];
  google.protobuf.Timestamp date_revoked = 16 [(orm.field) = {nullable: true}];
  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {name: "page" refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]},
      // Erasure never frees a credential subject for a different secret.
      {name: "subject" refs: [{name: "device", number: 8}, {name: "binding_key", number: 10}, {name: "purpose", number: 11}] unique: true hidden: true includes_erased: true}
    ]
  };
  option (payday.entity) = {
    domain: 32
    list: {
      order: [{field: {name: "date_created"}}, {field: {name: "id"}}]
      by: [{name: "ref"}, {name: "tenant"}, {name: "site"}, {name: "device"}, {name: "binding"}]
      size: 50 max: 500
    }
    watch: {}
  };
}
