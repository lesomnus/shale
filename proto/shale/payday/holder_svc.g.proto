edition = "2023";
package shale;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "shale/payday/holder.proto";
import "shale/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/shale/api";

service HolderService {
  // Add creates a new Holder
  rpc Add(HolderAddRequest) returns (Holder);
  // Get retrieves a Holder
  rpc Get(HolderGetRequest) returns (Holder);
  // Patch updates an existing Holder
  rpc Patch(HolderPatchRequest) returns (Holder);
  // Erase deletes a Holder
  rpc Erase(HolderRef) returns (HolderEraseResponse);
  // List reads Holders a page at a time.
  rpc List(HolderListRequest) returns (HolderListResponse);
  // Watch the Holders this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**: an item is the whole of a row
  // as this caller's Get reads it when the item is sent, and a client replaces
  // what it held of that row. An item is sent when a write touches a row the
  // stream is about, so a row erased, or taken out of this caller's sight by a
  // write, arrives with no value. A row that leaves this caller's sight with no
  // write to it -- what they may see changed, not the row -- is not said, and a
  // client goes on holding it for as long as the stream is open.
  //
  // A stream that cannot keep up is ended, and is not let skip: an open stream
  // has missed nothing. One that ended has, and asking again is how it is put
  // right, since the first message of the new one is everything that matches
  // then; a row that stopped matching in between is in no message of either.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless, since each is the whole row.
  rpc Watch(HolderWatchRequest) returns (stream HolderWatchResponse);
  // IssuePassword gives a person a fresh password, replacing whatever they
  // had, and answers it once. Only a person who sees every site may, and
  // only where roster runs in this process; at an external roster the
  // operator does it there.
  rpc IssuePassword(HolderIssuePasswordRequest) returns (HolderIssuePasswordResponse);
  // BeginKey begins making the caller a key for Shale. Where roster is
  // elsewhere it is a terminal's sign-in for one key at roster's account
  // app (`auth.roster.account`): the answer is where to send the caller's
  // browser to say yes at the identity service and a handle for PollKey,
  // and nothing is made without that yes. Where roster runs in this
  // process the key is made at once and answered once, since this console
  // is roster's front door there; a call made with a key does not make
  // one there.
  rpc BeginKey(HolderBeginKeyRequest) returns (HolderBeginKeyResponse);
  // PollKey asks whether the key BeginKey began is made yet: not yet,
  // refused, lapsed, or made, with its token this once. Only the session
  // or the key that began it may ask.
  rpc PollKey(HolderPollKeyRequest) returns (HolderPollKeyResponse);
  // ListKeys is the caller's own keys for Shale, as roster holds them.
  rpc ListKeys(HolderListKeysRequest) returns (HolderListKeysResponse);
  // EndKey ends one of the caller's keys for Shale at roster. Anything
  // else -- somebody else's key, one of roster's own or for another app,
  // one that is gone -- is NotFound.
  rpc EndKey(HolderEndKeyRequest) returns (HolderEndKeyResponse);
}

message HolderAddRequest {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
  TenantRef tenant = 2;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  google.protobuf.Timestamp date_created = 15;
  bool all_sites = 10 [features.field_presence = IMPLICIT];
}

message HolderGetRequest {
  HolderRef ref = 1;
  HolderSelect select = 2;
}

message HolderRef {
  oneof key {
    bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
    HolderRefBySlug slug = 4;
  }
}

message HolderRefBySlug {
  string alias = 4;
  TenantRef tenant = 2;
}

message HolderSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool all_sites = 10;
}

message HolderPatchRequest {
  HolderRef ref = 1;
  string alias = 8;
  string name = 10;
  string desc = 12;
  map<string, string> labels = 14;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  bool all_sites = 20;
}

message HolderEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message HolderListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated HolderFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];

  // Which fields of each row to answer with, and which edges filled and how
  // deep, as a Get's select says it. Unset is what a list answers without
  // one. Each row is read as a Get of it with this select would read it, each
  // edge through what the caller may see of its entity; a list costs one
  // read for the rows and one for each edge selected, at any depth, however
  // many rows the page holds.
  //
  // Field 6 in every entity: 5 is the order's, declared or not.
  HolderSelect select = 6;
}

message HolderListResponse {
  repeated Holder items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message HolderFilter {
  HolderRef ref = 1;
  TenantRef tenant = 2;
  map<string, string> labels = 3;
}

message HolderWatchRequest {
  // Which rows to watch, each named by its filter's ref. A filter that names
  // no row is refused, though List takes it: what a stream is about is the
  // rows its filters name, resolved once when it opens, and not what a List
  // of the same filters would answer later. The first message is that List's
  // answer now.
  //
  // Required, and bounded as a List's filters are. A watch with no filters
  // would be the whole table, forever, which is the one shape that has no cap
  // at all.
  repeated HolderFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message HolderWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated HolderWatchItem items = 1;
}

message HolderWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see** as a write to it left it: erased, or out of this caller's sight.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news. And only of a row a write touched: a row that
  // left this caller's sight because what they may see changed is not said.
  Holder value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message HolderIssuePasswordRequest {
  HolderRef ref = 1;
}

message HolderIssuePasswordResponse {
  string password = 1 [features.field_presence = IMPLICIT];
}

message HolderBeginKeyRequest {
  // What the key is called, in the spelling roster keeps a name in:
  // small letters, digits and single hyphens, beginning with a letter.
  string name = 1 [features.field_presence = IMPLICIT];
  // The methods of Shale's it may call, in full: each one the caller
  // holds at Shale, by a role of Shale's at roster, or roster refuses it.
  repeated string methods = 2;
  // When it stops working, after now; unset is a key that does not.
  google.protobuf.Timestamp date_expired = 3;
  // Shale's own word about the key, which roster keeps on it and answers
  // back when it is used (`ApiKey.scope`); empty for none.
  string scope = 4 [features.field_presence = IMPLICIT];
}

// HolderBeginKeyResponse is one answer of two shapes, told apart by
// `token`.
//
// Where roster is elsewhere `token` is empty, and `approve_at`,
// `user_code`, `handle`, `interval` and `date_lapses` are said: the
// caller's browser goes to `approve_at` to say yes, and PollKey is asked
// with `handle` every `interval` until it answers otherwise than pending.
//
// Where roster runs in this process `token` and `key` are said and the
// rest is empty: the key is made, and there is nothing to poll.
message HolderBeginKeyResponse {
  // Where the person says yes at the identity service, the code in it:
  // roster's account app's `verification_uri_complete`.
  string approve_at = 1 [features.field_presence = IMPLICIT];
  // The code that page asks for, for a person who opens it by hand.
  string user_code = 2 [features.field_presence = IMPLICIT];
  // What PollKey takes: sealed by Shale, opaque to whoever holds it, and
  // answered only to the session or the key that began it.
  string handle = 3 [features.field_presence = IMPLICIT];
  // How long to wait between two PollKey.
  google.protobuf.Duration interval = 4;
  // When the code lapses unless somebody said yes.
  google.protobuf.Timestamp date_lapses = 5;

  // The key's token, this once; only where roster runs in this process.
  string token = 6 [features.field_presence = IMPLICIT];
  // The key, as roster holds it; only beside `token`.
  HolderKey key = 7;
}

// HolderKey is a key of the caller's for Shale, as roster holds it; never
// its token, which is answered once, when it is made.
message HolderKey {
  // roster's identifier of the key: what EndKey takes.
  bytes id = 1 [features.field_presence = IMPLICIT];
  // What the person called it.
  string name = 2 [features.field_presence = IMPLICIT];
  // The methods of Shale's it may call, in full.
  repeated string methods = 3;
  // When it stops working; unset is a key that does not.
  google.protobuf.Timestamp date_expired = 4;
  // When it was last used; unset is never.
  google.protobuf.Timestamp date_used = 5;
  // When it was made.
  google.protobuf.Timestamp date_created = 6;
  // The word Shale had roster keep on it when it was made, as roster
  // holds it (`ApiKey.scope`); empty for none. Nothing reads it yet.
  string scope = 7 [features.field_presence = IMPLICIT];
}

message HolderPollKeyRequest {
  string handle = 1 [features.field_presence = IMPLICIT];
}

message HolderPollKeyResponse {
  HolderKeyState state = 1 [features.field_presence = IMPLICIT];
  // The key's token, this once, when `state` is MADE.
  string token = 2 [features.field_presence = IMPLICIT];
  // How long to wait before asking again, when `state` is PENDING.
  google.protobuf.Duration interval = 3;
}

// HolderKeyState is where a key BeginKey began is.
enum HolderKeyState {
  HOLDER_KEY_STATE_UNSPECIFIED = 0;
  // Nobody has said yes or no yet: ask again after the interval.
  HOLDER_KEY_STATE_PENDING = 1;
  // Made: `token` is the key's, answered this once.
  HOLDER_KEY_STATE_MADE = 2;
  // The person said no at the identity service. Nothing was made.
  HOLDER_KEY_STATE_REFUSED = 3;
  // Nobody said yes in time, or the key was carried away already by an
  // earlier PollKey. Nothing more comes of this handle.
  HOLDER_KEY_STATE_LAPSED = 4;
}

message HolderListKeysRequest {}

message HolderListKeysResponse {
  repeated HolderKey keys = 1;
  // The methods of Shale's the caller holds across their tenant, by a role
  // of Shale's at roster, of those the tenant API serves: what a key of
  // theirs may be given, and nothing else. Empty is a person who holds
  // none, who can make no key (roster's rule: a key acts as its person).
  repeated string holds = 2;
  // The console's reads, with Get beside every Watch: what every person
  // reads where roster says what people may change (§33.1), and what a key
  // that views and reads names, of those the caller holds.
  repeated string reads = 3;
  // How long a call made with a key may still be served, and a stream
  // opened with it still run, once it is ended (`auth.operators.ttl`).
  google.protobuf.Duration remembered = 4;
  // Why `holds` is empty where that is this deployment's doing and not the
  // person's: roster runs in this process and the deployment names no
  // operators (`auth.operators`), so no role of Shale's exists for anybody
  // to hold. Empty otherwise.
  string none_held = 5 [features.field_presence = IMPLICIT];
}

message HolderEndKeyRequest {
  // The key, by roster's identifier (`HolderKey.id`).
  bytes id = 1 [features.field_presence = IMPLICIT];
}

message HolderEndKeyResponse {
  // How long a call made with the key may still be served, and a stream
  // opened with it still run: what roster said of a key is believed for
  // `auth.operators.ttl` (30 s), and a key with a stream open is asked
  // about again when that runs out (§33.1).
  google.protobuf.Duration remembered = 1;
}
