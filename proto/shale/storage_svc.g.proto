message SinkProposeGcRequest {
  SinkRef ref = 1;
  GcReason reason = 2 [features.field_presence = IMPLICIT];
  repeated GcCandidate candidates = 3;
  int64 bytes_needed = 4 [features.field_presence = IMPLICIT];
}

message SinkProposeGcResponse {
  repeated GcDecision decisions = 1;
  int64 approved_bytes = 2 [features.field_presence = IMPLICIT];
}

// GcReason says why a node proposes (§21.2).
enum GcReason {
  GC_REASON_UNSPECIFIED = 0;
  GC_REASON_PRESSURE = 1;
  GC_REASON_SWEEP = 2;
}

// GcCandidate is a file, named by key, with what its xattr says.
message GcCandidate {
  string object_key = 1 [features.field_presence = IMPLICIT];
  bytes object_id = 2 [features.field_presence = IMPLICIT];
  bytes attempt_id = 3 [features.field_presence = IMPLICIT];
  int64 size = 4 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_expired = 5;
  google.protobuf.Timestamp date_deleted = 6;
  bytes tenant_id = 7 [features.field_presence = IMPLICIT];
}

message GcDecision {
  string object_key = 1 [features.field_presence = IMPLICIT];
  bool approved = 2 [features.field_presence = IMPLICIT];
  // The current dates when they differ from what the node proposed on; the
  // node rewrites the xattr.
  google.protobuf.Timestamp date_expired = 3;
  google.protobuf.Timestamp date_deleted = 4;
}

message SinkAdoptRequest {
  SinkRef ref = 1;
  NodeRef node = 2;
}

message SinkRetireRequest {
  SinkRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
}

message SinkReconcileRequest {
  SinkRef ref = 1;
  bool full = 2 [features.field_presence = IMPLICIT];
}

message SinkReconcileResponse {
  int64 sinks = 1 [features.field_presence = IMPLICIT];
}

message SinkGcRequest {
  SinkRef ref = 1;
}
