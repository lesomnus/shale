edition = "2023";
package shale;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "shale/common.proto";
import "shale/host_svc.g.proto";
import "shale/storage.proto";

option go_package = "github.com/lesomnus/shale/api";

service DeviceService {
  // Add creates a new Device
  rpc Add(DeviceAddRequest) returns (Device);
  // Get retrieves a Device
  rpc Get(DeviceGetRequest) returns (Device);
  // Patch updates an existing Device
  rpc Patch(DevicePatchRequest) returns (Device);
  // Apply applies a patch document to an existing Device
  rpc Apply(DeviceApplyRequest) returns (Device);
  // Erase deletes a Device
  rpc Erase(DeviceRef) returns (DeviceEraseResponse);
  // List reads Devices a page at a time.
  rpc List(DeviceListRequest) returns (DeviceListResponse);
  // Watch the Devices this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(DeviceWatchRequest) returns (stream DeviceWatchResponse);
  rpc Quarantine(DeviceQuarantineRequest) returns (Device);
  rpc Release(DeviceReleaseRequest) returns (Device);
  rpc Retire(DeviceRetireRequest) returns (Device);
  // Its objects become LOST; the device is forgotten.
  rpc DeclareDead(DeviceDeclareDeadRequest) returns (Device);
  // Bay LED on or off, through the node's control API.
  rpc Locate(DeviceLocateRequest) returns (Device);
}

service SinkService {
  // Add creates a new Sink
  rpc Add(SinkAddRequest) returns (Sink);
  // Get retrieves a Sink
  rpc Get(SinkGetRequest) returns (Sink);
  // Patch updates an existing Sink
  rpc Patch(SinkPatchRequest) returns (Sink);
  // Apply applies a patch document to an existing Sink
  rpc Apply(SinkApplyRequest) returns (Sink);
  // Erase deletes a Sink
  rpc Erase(SinkRef) returns (SinkEraseResponse);
  // List reads Sinks a page at a time.
  rpc List(SinkListRequest) returns (SinkListResponse);
  // Watch the Sinks this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(SinkWatchRequest) returns (stream SinkWatchResponse);
  // The node proposes deletion candidates; the CP approves (§21.2).
  rpc ProposeGc(SinkProposeGcRequest) returns (SinkProposeGcResponse);
  // Attach a moved sink to the node that reports it (§28.3).
  rpc Adopt(SinkAdoptRequest) returns (Sink);
  rpc Retire(SinkRetireRequest) returns (Sink);
  // Reconcile the sink with its node now, from the beginning with `full`
  // (§34.9, §29); every sink when no ref is given. The leader carries it out.
  rpc Reconcile(SinkReconcileRequest) returns (SinkReconcileResponse);
  // Run a GC round on the sink now, through the node's control API (§21).
  rpc Gc(SinkGcRequest) returns (Sink);
}

message DeviceAddRequest {
  bytes id = 1;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  NodeRef node = 8;
  string hardware_id = 9 [features.field_presence = IMPLICIT];
  string slot = 10 [features.field_presence = IMPLICIT];
  DeviceHealth health = 11 [features.field_presence = IMPLICIT];
  double failure_score = 12 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
  google.protobuf.Timestamp date_scored = 16;
  DeviceQuarantine quarantine = 17;
  SmartSummary smart = 18;
  int64 capacity = 19 [features.field_presence = IMPLICIT];
  string model = 20 [features.field_presence = IMPLICIT];
  DeviceReport report = 21;
  google.protobuf.Timestamp date_seen = 22;
}

message DeviceGetRequest {
  DeviceRef ref = 1;
  DeviceSelect select = 2;
}

message DeviceRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
    string hardware_id = 9;
  }
}

message DeviceSelect {
  bool all = 1;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  NodeSelect node = 8;
  bool hardware_id = 9;
  bool slot = 10;
  bool health = 11;
  bool failure_score = 12;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool date_scored = 16;
  bool quarantine = 17;
  bool smart = 18;
  bool capacity = 19;
  bool model = 20;
  bool report = 21;
  bool date_seen = 22;
}

message DevicePatchRequest {
  DeviceRef ref = 1;
  string alias = 8;
  string name = 10;
  string desc = 12;
  map<string, string> labels = 14;
  NodeRef node = 16;
  // Clear node instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and node clears.
  bool node_null = 17;
  string hardware_id = 18;
  string slot = 20;
  DeviceHealth health = 22;
  double failure_score = 24;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  google.protobuf.Timestamp date_scored = 32;
  // Clear date_scored instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_scored clears.
  bool date_scored_null = 33;
  DeviceQuarantine quarantine = 34;
  // Clear quarantine instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and quarantine clears.
  bool quarantine_null = 35;
  SmartSummary smart = 36;
  // Clear smart instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and smart clears.
  bool smart_null = 37;
  int64 capacity = 38;
  string model = 40;
  DeviceReport report = 42;
  // Clear report instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and report clears.
  bool report_null = 43;
  google.protobuf.Timestamp date_seen = 44;
  // Clear date_seen instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_seen clears.
  bool date_seen_null = 45;
}

message DeviceApplyRequest {
  DeviceRef ref = 1;
  patch.Patch patch = 2;
}

message DeviceEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message DeviceListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated DeviceFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message DeviceListResponse {
  repeated Device items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message DeviceFilter {
  DeviceRef ref = 1;
  NodeRef node = 2;
}

message DeviceWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated DeviceFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message DeviceWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated DeviceWatchItem items = 1;
}

message DeviceWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Device value = 2;

  // The RPC that changed it, by the name gRPC knows it by. It is what the
  // caller of *that* RPC asked for and not the write it became, so an RPC
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message DeviceQuarantineRequest {
  DeviceRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
}

message DeviceReleaseRequest {
  DeviceRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
}

message DeviceRetireRequest {
  DeviceRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
}

message DeviceDeclareDeadRequest {
  DeviceRef ref = 1;
  string reason = 2 [features.field_presence = IMPLICIT];
}

message DeviceLocateRequest {
  DeviceRef ref = 1;
  bool off = 2 [features.field_presence = IMPLICIT];
}

