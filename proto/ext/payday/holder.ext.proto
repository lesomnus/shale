edition = "2023";

package payday;

import "orm.proto";
import "payday.proto";

// What Shale adds to payday's Holder: people are Holders (§33.1). Who they
// are, and how they sign in, is roster's; a row here is anchored on
// roster's identifier and made when the person first arrives.
message Holder {
  // A tenant admin sees every site; a person without this sees only the
  // sites they are a member of (§33.1). The first person of a tenant gets
  // it.
  bool all_sites = 10;
}
