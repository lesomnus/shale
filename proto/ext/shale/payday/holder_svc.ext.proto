edition = "2023";

package shale;

import "shale/payday/holder.proto";

// What Shale adds to the generated contract of Holder: people sign in at
// roster (§33.1), so a password is issued there, by the deployment, and
// shown once.

service HolderService {
  // IssuePassword gives a person a fresh password, replacing whatever they
  // had, and answers it once. Only a person who sees every site may, and
  // only where roster runs in this process; at an external roster the
  // operator does it there.
  rpc IssuePassword(HolderIssuePasswordRequest) returns (HolderIssuePasswordResponse);
}

message HolderIssuePasswordRequest {
  HolderRef ref = 1;
}

message HolderIssuePasswordResponse {
  string password = 1 [features.field_presence = IMPLICIT];
}
