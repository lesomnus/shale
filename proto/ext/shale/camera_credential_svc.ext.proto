edition = "2023";
package shale;

import "google/protobuf/timestamp.proto";
import "shale/camera.proto";
import "shale/camera_svc.g.proto";
import "shale/camera_worker_svc.g.proto";
import "shale/camera_credential_version.proto";
import "shale/set_svc.g.proto";

option go_package = "github.com/lesomnus/shale/api";

service CameraCredentialService {
  rpc Prepare(CameraCredentialPrepareRequest) returns (CameraCredentialPrepared);
  rpc Import(CameraCredentialImportRequest) returns (CameraCredentialPrepared);
  rpc Resolve(CameraCredentialResolveRequest) returns (CameraCredentialLease);
  rpc Revoke(CameraCredentialRevokeRequest) returns (CameraCredentialRevokeResponse);
}

// These are explicit secret-transfer operations, not ordinary inventory CRUD.
// Handlers decode raw material directly into a redacted in-process value; raw
// request/response protobufs are never status, audit, log or Source DTOs.
message CameraCredentialPrepareRequest {
  CameraDeviceRef device = 1;
  CameraBindingRef binding = 2;
  string purpose = 3 [features.field_presence = IMPLICIT];
  string intent_key = 4 [features.field_presence = IMPLICIT];
  // Empty selects the configured initial-administrator username (admin).
  bytes username = 5 [features.field_presence = IMPLICIT];
  string access = 6 [features.field_presence = IMPLICIT];
  // Copy an already installed account into another explicit delivery purpose.
  CameraCredentialReference reuse = 7;
}

message CameraCredentialImportRequest {
  CameraDeviceRef device = 1;
  CameraBindingRef binding = 2;
  string purpose = 3 [features.field_presence = IMPLICIT];
  string intent_key = 4 [features.field_presence = IMPLICIT];
  string access = 5 [features.field_presence = IMPLICIT];
  // Explicit lossless Material binary, not JSON username/password strings.
  bytes material = 6 [features.field_presence = IMPLICIT];
  CameraCredentialReference expected_current = 7;
  CameraLegacyCredentialReference legacy = 8;
}

// Preparation returns references only. The enclosing transaction has committed
// before an RPC response makes these recoverable references available to a
// Worker. A policy's internal preparation and Job.Create share that transaction.
message CameraCredentialPrepared {
  CameraCredentialReference credential = 1;
  bytes device_id = 2;
  bytes binding_id = 3;
  string access = 4 [features.field_presence = IMPLICIT];
  CameraCredentialOrigin origin = 5 [features.field_presence = IMPLICIT];
  string backend = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 7;
  bool revoked = 8 [features.field_presence = IMPLICIT];
}

message CameraCredentialResolveRequest {
  CameraCredentialReference credential = 1;
  // Required for Workers; exact pinned JobInputs purpose/reference only.
  CameraWorkerCheckJobRequest job = 2;
  // Producer streaming delivery is bound to this current assigned Source.
  // A binding-specific reference may identify it without this optional field.
  SourceRef source = 3;
  // Zero disables an offline streaming cache grant. Workers cannot request it.
  int64 cache_seconds = 4 [features.field_presence = IMPLICIT];
  int64 lease_seconds = 5 [features.field_presence = IMPLICIT];
  int64 source_revision = 6 [features.field_presence = IMPLICIT];
  string access = 7 [features.field_presence = IMPLICIT];
}

// Current delivery metadata is deliberately separate from the immutable secret
// identity/AAD, so a separately adopted replacement machine can recover it.
message CameraCredentialDelivery {
  bytes tenant_id = 1;
  bytes site_id = 2;
  bytes set_id = 3;
  bytes producer_id = 4;
  bytes network_id = 5;
  bytes device_id = 6;
  bytes binding_id = 7;
  bytes source_id = 8;
  bytes assignment_id = 9;
  int64 assignment_generation = 10 [features.field_presence = IMPLICIT];
  int64 source_revision = 11 [features.field_presence = IMPLICIT];
  int64 lease_generation = 12 [features.field_presence = IMPLICIT];
  bytes job_id = 13;
}

message CameraCredentialLease {
  // Plaintext only on this authenticated, explicitly requested transfer.
  bytes material = 1 [features.field_presence = IMPLICIT];
  CameraCredentialReference credential = 2;
  google.protobuf.Timestamp expires = 3;
  CameraCredentialDelivery delivery = 4;
  // A cache grant does not attest that capture applied the source. The client
  // additionally requires its own matching applied-state acknowledgement.
  google.protobuf.Timestamp cache_until = 5;
  string access = 6 [features.field_presence = IMPLICIT];
}

message CameraCredentialRevokeRequest { CameraCredentialReference credential = 1; }
message CameraCredentialRevokeResponse {}
