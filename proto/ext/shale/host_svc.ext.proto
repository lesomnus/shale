edition = "2023";

package shale;

import "shale/common.proto";
import "shale/host.proto";
import "shale/set_svc.g.proto";
import "shale/site_svc.g.proto";
import "shale/storage.proto";

option go_package = "github.com/lesomnus/shale/api";

// What Shale adds to the generated contracts of the four hosts (§35.4,
// §35.5): joining and adoption, certificates, heartbeats, events.

service ProducerService {
  // Called without a credential by a host on its first run, and polled until
  // an admin adopts it: hardware identity, hostname, and CSR in; certificate
  // and CA bundle out once adopted (§33.4).
  rpc Join(ProducerJoinRequest) returns (ProducerJoinResponse);
  // A tenant admin accepts a pending producer and assigns its set.
  rpc Adopt(ProducerAdoptRequest) returns (Producer);
  // Called over mTLS before the certificate expires (§33.5).
  rpc RenewCertificate(ProducerRenewCertificateRequest) returns (ProducerRenewCertificateResponse);
  // Input state per source and host load, every producer_heartbeat_interval
  // (§38.6). The answer carries the current relay assignment (§39.2).
  rpc Heartbeat(ProducerHeartbeatRequest) returns (ProducerHeartbeatResponse);
  // The current relay assignment and a fresh publish token, on demand.
  rpc Relay(ProducerRelayRequest) returns (ProducerRelayResponse);
}

service ReaderService {
  rpc Join(ReaderJoinRequest) returns (ReaderJoinResponse);
  rpc Adopt(ReaderAdoptRequest) returns (Reader);
  rpc RenewCertificate(ReaderRenewCertificateRequest) returns (ReaderRenewCertificateResponse);
  // Keeps date_seen current and reports the certificate serial.
  rpc Heartbeat(ReaderHeartbeatRequest) returns (ReaderHeartbeatResponse);
}

service NodeService {
  // Hardware identity, hostname, interfaces, sinks, and CSR in; polled until
  // adopted; node_id, certificate, CA bundle, and key set out (§33.4).
  rpc Join(NodeJoinRequest) returns (NodeJoinResponse);
  // An operator accepts a pending node.
  rpc Adopt(NodeAdoptRequest) returns (Node);
  rpc RenewCertificate(NodeRenewCertificateRequest) returns (NodeRenewCertificateResponse);
  // Health, capacity, and pressure of the node, its devices, and its sinks
  // (§27).
  rpc Heartbeat(NodeHeartbeatRequest) returns (NodeHeartbeatResponse);
  // LaminaStored, LaminaDeleted, and LaminaMissing events, batched; applied
  // idempotently (§34.9).
  rpc PushEvents(NodePushEventsRequest) returns (NodePushEventsResponse);
  // What the active address resolver would hand out, for a given caller
  // (§34.10).
  rpc Resolve(NodeResolveRequest) returns (NodeResolveResponse);
}

service RelayService {
  rpc Join(RelayJoinRequest) returns (RelayJoinResponse);
  rpc Adopt(RelayAdoptRequest) returns (Relay);
  rpc RenewCertificate(RelayRenewCertificateRequest) returns (RelayRenewCertificateResponse);
  // Attached producers, active sources, viewers, egress, load (§39.2).
  rpc Heartbeat(RelayHeartbeatRequest) returns (RelayHeartbeatResponse);
  // An operator moves a producer to a relay; the assignment stays sticky.
  rpc Assign(RelayAssignRequest) returns (Relay);
}

// JoinAnswer is what every host's Join answers: pending, or adopted with the
// certificate.
message JoinAnswer {
  HostState state = 1 [features.field_presence = IMPLICIT];
  bytes id = 2 [features.field_presence = IMPLICIT];
  string alias = 3 [features.field_presence = IMPLICIT];
  // PEM: the host certificate, then the chain.
  bytes certificate = 4 [features.field_presence = IMPLICIT];
  // PEM: every CA a host must trust, the current and the next during a
  // rollover (§33.5).
  bytes ca_bundle = 5 [features.field_presence = IMPLICIT];
  string message = 6 [features.field_presence = IMPLICIT];
  bool rejoin = 7 [features.field_presence = IMPLICIT];
}

message ProducerJoinRequest {
  HostJoin host = 1;
  // The tenant this producer is meant for, implied in a single-organization
  // cluster.
  string tenant = 2 [features.field_presence = IMPLICIT];
}

message ProducerJoinResponse {
  JoinAnswer answer = 1;
}

message ProducerAdoptRequest {
  ProducerRef ref = 1;
  SetRef set = 2;
  // The alias to give it; the hostname when empty.
  string alias = 3 [features.field_presence = IMPLICIT];
}

message ProducerRenewCertificateRequest {
  bytes csr = 1 [features.field_presence = IMPLICIT];
}

message ProducerRenewCertificateResponse {
  bytes certificate = 1 [features.field_presence = IMPLICIT];
  bytes ca_bundle = 2 [features.field_presence = IMPLICIT];
}

message ProducerHeartbeatRequest {
  repeated SourceReport sources = 1;
  HostLoad load = 2;
  string ca_hash = 3 [features.field_presence = IMPLICIT];
  string version = 4 [features.field_presence = IMPLICIT];
  string relay_state = 5 [features.field_presence = IMPLICIT];
}

// Suggestion is a ceiling the CP suggests raising (§38.5); with auto_raise
// the CP has already raised it.
message Suggestion {
  bytes source_id = 1 [features.field_presence = IMPLICIT];
  int64 max_bitrate = 2 [features.field_presence = IMPLICIT];
  int64 suggested = 3 [features.field_presence = IMPLICIT];
  bool applied = 4 [features.field_presence = IMPLICIT];
  string reason = 5 [features.field_presence = IMPLICIT];
}

message ProducerHeartbeatResponse {
  RelayAssignment relay = 1;
  int64 profile_version = 2 [features.field_presence = IMPLICIT];
  repeated Suggestion suggestions = 3;
  // Renew the certificate now.
  bool renew_certificate = 4 [features.field_presence = IMPLICIT];
}

message ProducerRelayRequest {}

message ProducerRelayResponse {
  RelayAssignment relay = 1;
}

message ReaderJoinRequest {
  HostJoin host = 1;
  string tenant = 2 [features.field_presence = IMPLICIT];
}

message ReaderJoinResponse {
  JoinAnswer answer = 1;
}

message ReaderAdoptRequest {
  ReaderRef ref = 1;
  // None means the whole tenant.
  repeated SiteRef sites = 2;
  string alias = 3 [features.field_presence = IMPLICIT];
}

message ReaderRenewCertificateRequest {
  bytes csr = 1 [features.field_presence = IMPLICIT];
}

message ReaderRenewCertificateResponse {
  bytes certificate = 1 [features.field_presence = IMPLICIT];
  bytes ca_bundle = 2 [features.field_presence = IMPLICIT];
}

message ReaderHeartbeatRequest {
  string ca_hash = 1 [features.field_presence = IMPLICIT];
  string version = 2 [features.field_presence = IMPLICIT];
}

message ReaderHeartbeatResponse {
  bool renew_certificate = 1 [features.field_presence = IMPLICIT];
}

message NodeJoinRequest {
  HostJoin host = 1;
  repeated HostInterface interfaces = 2;
  repeated SinkReport sinks = 3;
  repeated DeviceReport devices = 4;
  string control_address = 5 [features.field_presence = IMPLICIT];
  string data_address = 6 [features.field_presence = IMPLICIT];
}

message NodeJoinResponse {
  JoinAnswer answer = 1;
  repeated KeyEntry keys = 2;
}

message NodeAdoptRequest {
  NodeRef ref = 1;
  string alias = 2 [features.field_presence = IMPLICIT];
}

message NodeRenewCertificateRequest {
  bytes csr = 1 [features.field_presence = IMPLICIT];
}

message NodeRenewCertificateResponse {
  bytes certificate = 1 [features.field_presence = IMPLICIT];
  bytes ca_bundle = 2 [features.field_presence = IMPLICIT];
}

message NodeHeartbeatRequest {
  string cert_serial = 1 [features.field_presence = IMPLICIT];
  string ca_hash = 2 [features.field_presence = IMPLICIT];
  repeated string key_ids = 3;
  repeated DeviceReport devices = 4;
  repeated SinkReport sinks = 5;
  repeated HostInterface interfaces = 6;
  string control_address = 7 [features.field_presence = IMPLICIT];
  string data_address = 8 [features.field_presence = IMPLICIT];
  string version = 9 [features.field_presence = IMPLICIT];
  int64 uploads_in_flight = 10 [features.field_presence = IMPLICIT];
  int64 index_laminae = 11 [features.field_presence = IMPLICIT];
  repeated string warnings = 12;
}

// SinkAnswer is what the CP says back about each reported sink (§28.3).
message SinkAnswer {
  bytes sink_id = 1 [features.field_presence = IMPLICIT];
  SinkAttachment attachment = 2 [features.field_presence = IMPLICIT];
  // Whether this node may serve the sink: false while it is attached to
  // another node.
  bool serve = 3 [features.field_presence = IMPLICIT];
  bool accept_writes = 4 [features.field_presence = IMPLICIT];
}

message NodeHeartbeatResponse {
  repeated SinkAnswer sinks = 1;
  bool renew_certificate = 2 [features.field_presence = IMPLICIT];
}

message NodePushEventsRequest {
  repeated Event events = 1;
}

message NodePushEventsResponse {
  int32 applied = 1 [features.field_presence = IMPLICIT];
}

message NodeResolveRequest {
  NodeRef ref = 1;
  // The caller's address; the calling connection's when empty.
  string from = 2 [features.field_presence = IMPLICIT];
  string protocol = 3 [features.field_presence = IMPLICIT];
}

message NodeResolveResponse {
  repeated Endpoint endpoints = 1;
}

message RelayJoinRequest {
  HostJoin host = 1;
  repeated HostInterface interfaces = 2;
  string ingest_address = 3 [features.field_presence = IMPLICIT];
  string whep_address = 4 [features.field_presence = IMPLICIT];
}

message RelayJoinResponse {
  JoinAnswer answer = 1;
  repeated KeyEntry keys = 2;
}

message RelayAdoptRequest {
  RelayRef ref = 1;
  string alias = 2 [features.field_presence = IMPLICIT];
}

message RelayRenewCertificateRequest {
  bytes csr = 1 [features.field_presence = IMPLICIT];
}

message RelayRenewCertificateResponse {
  bytes certificate = 1 [features.field_presence = IMPLICIT];
  bytes ca_bundle = 2 [features.field_presence = IMPLICIT];
}

message RelayHeartbeatRequest {
  string cert_serial = 1 [features.field_presence = IMPLICIT];
  string ca_hash = 2 [features.field_presence = IMPLICIT];
  repeated string key_ids = 3;
  RelayStatus status = 4;
  repeated HostInterface interfaces = 5;
  string ingest_address = 6 [features.field_presence = IMPLICIT];
  string whep_address = 7 [features.field_presence = IMPLICIT];
  string version = 8 [features.field_presence = IMPLICIT];
}

message RelayHeartbeatResponse {
  bool renew_certificate = 1 [features.field_presence = IMPLICIT];
}

message RelayAssignRequest {
  RelayRef ref = 1;
  ProducerRef producer = 2;
}
