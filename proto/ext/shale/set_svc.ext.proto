edition = "2023";

package shale;

import "google/protobuf/timestamp.proto";
import "shale/common.proto";
import "shale/camera.proto";
import "shale/set.proto";
import "shale/site_svc.g.proto";

option go_package = "github.com/lesomnus/shale/api";

// What Shale adds to the generated contracts of Set and Source (§35.4).

service SetService {
  // Proposed upload profile in, agreed profile and adjustments out (§12.6).
  // The answer also carries the producer's relay assignment (§39.2) and
  // its satellite assignment (§41.2).
  rpc Negotiate(SetNegotiateRequest) returns (SetNegotiateResponse);
  // Allocations for every member of the set, up to a horizon (§12.1).
  rpc Allocate(SetAllocateRequest) returns (SetAllocateResponse);
  // Live viewing: per member, the relay's endpoints, a view token, and the
  // WHEP URL (§39.4).
  rpc Live(SetLiveRequest) returns (SetLiveResponse);
  // Puts a set that exists into a site, or moves it from one to another
  // (§7): the set, its sources, their laminae and attempts and its
  // producer, and for a set whose cameras Shale manages its camera network
  // with everything of it, in one transaction. Whoever sees every site
  // may; no site at all is refused, and so is a camera network or a row of
  // it that something else shares.
  rpc Place(SetPlaceRequest) returns (SetPlaceResponse);
}

service SourceService {
  // Live viewing of one source (§39.4).
  rpc Live(SourceLiveRequest) returns (SourceLiveResponse);
}

message SourceProposal {
  SourceRef source = 1;
  SegmentProfile profile = 2;
  // What the producer sends for this source (§38.9): `video/mp4` for a
  // camera or a pushed MP4 stream, the writer's declared type for raw
  // frames. Fills in the source's content_type when nobody set it.
  string content_type = 3 [features.field_presence = IMPLICIT];
  // Whether the producer can feed this source to a relay (§39.3): a
  // stream it reads, not raw frames. Only the producer knows.
  bool live_capable = 4 [features.field_presence = IMPLICIT];
}

message SetNegotiateRequest {
  SetRef ref = 1;
  LinkProfile link = 2;
  repeated SourceProposal sources = 3;
  // Managed full membership: no historical member budgets or scaled copy feeds.
  CameraApplyTarget catalog = 4;
  bool preview = 5 [features.field_presence = IMPLICIT];
  // The producer uploads through a satellite where one is assigned
  // (`upload_via`, §41.5): the answer carries its assignment. A producer
  // that does not say is not assigned one.
  bool satellite = 6 [features.field_presence = IMPLICIT];
}

message SourceAgreed {
  bytes source_id = 1 [features.field_presence = IMPLICIT];
  int32 ordinal = 2 [features.field_presence = IMPLICIT];
  SegmentProfile profile = 3;
  int64 max_length = 4 [features.field_presence = IMPLICIT];
}

// Adjustment says what the CP changed about a proposal and why.
message Adjustment {
  bytes source_id = 1 [features.field_presence = IMPLICIT];
  string field = 2 [features.field_presence = IMPLICIT];
  string proposed = 3 [features.field_presence = IMPLICIT];
  string agreed = 4 [features.field_presence = IMPLICIT];
  string reason = 5 [features.field_presence = IMPLICIT];
}

message SetNegotiateResponse {
  int64 profile_version = 1 [features.field_presence = IMPLICIT];
  LinkProfile link = 2;
  repeated SourceAgreed sources = 3;
  repeated Adjustment adjustments = 4;
  RelayAssignment relay = 5;
  // The satellite the producer uploads through when its `upload_via` says
  // so (§41.2), as its heartbeat answers it.
  SatelliteAssignment satellite = 6;
}

message SetAllocateRequest {
  SetRef ref = 1;
  // How far ahead, at most the agreed allocation_horizon. Zero is the
  // horizon.
  int64 horizon_seconds = 2 [features.field_presence = IMPLICIT];
  // The producer's idea of now, so a slot list lines up with its clock;
  // absent means the CP's clock.
  google.protobuf.Timestamp now = 3;
}

message SetAllocateResponse {
  int64 profile_version = 1 [features.field_presence = IMPLICIT];
  repeated Allocation allocations = 2;
}

message SetLiveRequest {
  SetRef ref = 1;
}

// LiveSource is one source's live endpoint for a viewer (§39.4).
message LiveSource {
  bytes source_id = 1 [features.field_presence = IMPLICIT];
  int32 ordinal = 2 [features.field_presence = IMPLICIT];
  bytes relay_id = 3 [features.field_presence = IMPLICIT];
  repeated Endpoint endpoints = 4;
  string whep_url = 5 [features.field_presence = IMPLICIT];
  string view_token = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_expires = 7;
  // GET here with the view token for the recent window: the last minutes
  // of the source as one TS, tables first, a keyframe first (§39.4).
  string recent_url = 8 [features.field_presence = IMPLICIT];
  string capture_epoch = 9 [features.field_presence = IMPLICIT];
}

message SetLiveResponse {
  repeated LiveSource sources = 1;
}

message SourceLiveRequest {
  SourceRef ref = 1;
}

message SourceLiveResponse {
  LiveSource source = 1;
}

message SetPlaceRequest {
  SetRef set = 1;
  // Where the set goes. Required: out of a site into none is not offered.
  SiteRef site = 2;
  // Count what would move and write nothing.
  bool dry_run = 3 [features.field_presence = IMPLICIT];
}

// SetPlaced is how many rows of each kind carry the set's site because of
// the set, which a placing rewrites (§7).
message SetPlaced {
  int64 sources = 1 [features.field_presence = IMPLICIT];
  int64 laminae = 2 [features.field_presence = IMPLICIT];
  int64 attempts = 3 [features.field_presence = IMPLICIT];
  int64 producers = 4 [features.field_presence = IMPLICIT];
  // For a set whose cameras Shale manages, its camera rows: its
  // assignments, their bindings and jobs; the network they are on, its
  // devices, the devices' credentials and their versions, the network's
  // policies, the presets only they use; and the camera worker.
  int64 camera_assignments = 5 [features.field_presence = IMPLICIT];
  int64 camera_bindings = 6 [features.field_presence = IMPLICIT];
  int64 camera_jobs = 7 [features.field_presence = IMPLICIT];
  int64 camera_networks = 8 [features.field_presence = IMPLICIT];
  int64 camera_devices = 9 [features.field_presence = IMPLICIT];
  int64 camera_credentials = 10 [features.field_presence = IMPLICIT];
  int64 camera_credential_versions = 11 [features.field_presence = IMPLICIT];
  int64 camera_policies = 12 [features.field_presence = IMPLICIT];
  int64 camera_presets = 13 [features.field_presence = IMPLICIT];
  int64 camera_workers = 14 [features.field_presence = IMPLICIT];
}

message SetPlaceResponse {
  // The set as it is now: in the site, or, for a dry run or a set already
  // there, as it was.
  Set set = 1;
  // The site it was in; empty for none.
  bytes from_site_id = 2 [features.field_presence = IMPLICIT];
  // The rows rewritten, or for a dry run the rows that would be; all zero
  // for a set already in the site.
  SetPlaced moved = 3;
  bool dry_run = 4 [features.field_presence = IMPLICIT];
  // For a dry run, why the placing would be refused, each in a sentence
  // that names what is shared and what an operator would do; empty when it
  // would not be. A placing that is refused writes nothing and answers
  // FAILED_PRECONDITION with the same sentences.
  repeated string refused = 5;
}
