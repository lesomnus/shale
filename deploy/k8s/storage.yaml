# Storage Nodes: a DaemonSet on the nodes labeled `shale.io/storage=true`,
# on the host network so producers reach the one node placement chose
# (§34.5). The state directory is a hostPath, so a node keeps its key and
# identity across pod restarts; sinks are hostPath mounts of the disks.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: shale-storage
spec:
  selector:
    matchLabels:
      app: shale-storage
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # One node at a time: its laminae are UNAVAILABLE while it restarts,
      # and nothing else (§34.5).
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: shale-storage
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        shale.io/storage: "true"
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: storage
          image: ghcr.io/lesomnus/shale:dev
          args: ["--config", "/etc/shale/shale.yaml", "serve", "storage"]
          env:
            # The node is dialed on its host address: the CP reaches the
            # control API there, and producers the data plane (§34.5).
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SHALE_STORAGE_CONTROL_ADDR
              value: "$(HOST_IP):7421"
            - name: SHALE_STORAGE_ADVERTISE
              value: "$(HOST_IP):7420"
            # For the console's Playback and Export in a browser (§40.5):
            # the data plane serves a certificate from a public CA (see
            # cert_file in storage-config.yaml), and the node is named as
            # that certificate names it, a name the CP hands out as it is
            # (§34.10). One name per node: with a wildcard certificate,
            # the Kubernetes node's name under it, each resolving to that
            # node's address. Producers upload to the same name.
            # - name: NODE_NAME
            #   valueFrom:
            #     fieldRef:
            #       fieldPath: spec.nodeName
            # - name: SHALE_STORAGE_ADVERTISE
            #   value: "$(NODE_NAME).storage.example.com:7420"
          securityContext:
            # SMART and bay LEDs need the devices (§34.8); a node with
            # directory sinks does without.
            capabilities:
              add: ["SYS_RAWIO"]
          ports:
            - containerPort: 7420
              name: data
            - containerPort: 7421
              name: control
          readinessProbe:
            tcpSocket:
              port: 7420
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/shale
            - name: state
              mountPath: /var/lib/shale
            - name: sink-0
              mountPath: /srv/shale/sinks/0
            # A certificate browsers trust for the data plane (§33.5),
            # from cert-manager; see cert_file in storage-config.yaml.
            # - name: data-cert
            #   mountPath: /etc/shale/data
            #   readOnly: true
      volumes:
        - name: config
          configMap:
            name: shale-storage-config
        - name: state
          hostPath:
            path: /var/lib/shale-k8s
            type: DirectoryOrCreate
        - name: sink-0
          hostPath:
            # The mount point of the disk; a directory on the OS disk in a lab.
            # A real disk takes `type: Directory`: `DirectoryOrCreate` makes an
            # empty directory on the OS disk when the mount is missing, and the
            # node registers that as a new, empty sink (README, "Which disk, on
            # which machine").
            path: /srv/shale/k8s/sinks/0
            type: DirectoryOrCreate
        # - name: data-cert
        #   secret:
        #     secretName: shale-storage-tls
# ---
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
