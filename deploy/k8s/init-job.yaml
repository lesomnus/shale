# `shale init` once: the CA, the KEK, the CP certificate, the first tenant
# and its admin, the cluster operators, and the first signing key. Inside
# the cluster the files go into the `shale-control` Secret through the
# job's service account (§34.5). The first passwords go into a Secret of
# their own, `shale-control-passwords`, one key per person, and not into the
# job's log, which a log collector would keep and a recreated job loses:
#
#   kubectl -n shale get secret shale-control-passwords -o jsonpath='{.data.cluster\.ops}' | base64 -d
#   kubectl -n shale get secret shale-control-passwords -o jsonpath='{.data.acme\.admin}' | base64 -d
#
# Keep them, then delete that Secret and the job. Running it again does
# nothing while `shale-control` exists.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shale-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shale-init
rules:
  # get: whether `shale-control` is there. create: it and
  # `shale-control-passwords`, each asked first as a dry run. Never update
  # or delete: neither is ever written over.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shale-init
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shale-init
subjects:
  - kind: ServiceAccount
    name: shale-init
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shale-init
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: shale-init
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: init
          image: ghcr.io/lesomnus/shale:dev
          args: ["--config", "/etc/shale/shale.yaml", "init", "--if-needed", "--k8s-secret", "shale-control", "--tenant", "acme", "--admin", "admin", "--operator", "ops"]
          env:
            - name: SHALE_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: shale-db
                  key: SHALE_DB_DSN
            - name: SHALE_AUTH_ROSTER_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: shale-db
                  key: SHALE_AUTH_ROSTER_DB_DSN
          volumeMounts:
            - name: config
              mountPath: /etc/shale
            - name: state
              mountPath: /var/lib/shale
      volumes:
        - name: config
          configMap:
            name: shale-control-config
        - name: state
          emptyDir: {}
