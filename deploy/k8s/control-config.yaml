# The Control Plane's configuration (§36.1), shared by the init job and
# both API Deployments. The state directory is the `shale-control` Secret
# the init job makes: the KEK, the CA, and the CP certificate (§34.5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shale-control-config
data:
  shale.yaml: |
    state: /var/lib/shale
    db:
      driver: pgx
      # dsn comes from the SHALE_DB_DSN environment variable (the shale-db Secret)
      migrate: true
    watch:
      broker: postgres
    auth:
      roster:
        # roster in this process (§33.1), on its own database, which every
        # control plane shares: dsn comes from SHALE_AUTH_ROSTER_DB_DSN.
        db:
          driver: pgx
    server:
      addr: ":7400"
      http:
        addr: ":7402"
        # The console (§40) is served here, at the root, and calls the
        # tenant API through this listener: same origin, nothing to name.
        allow_web: true
    cluster:
      addr: ":7401"
      http:
        addr: ":7403"
        # The console's operator half signs in here, cross-origin from
        # where the page was opened: every origin the console is opened
        # by, which without an Ingress is a node IP on the NodePort.
        allow_web: true
        origins:
          - https://10.1.2.73:30402
          - https://10.1.2.74:30402
          - https://10.1.2.75:30402
    control:
      # Every name a client dials the APIs by: the Services, and the node
      # addresses the NodePort is reached on from outside the cluster.
      names:
        - shale-control
        - shale-control.shale.svc
        - shale-control.shale.svc.cluster.local
        - shale-cluster
        - shale-cluster.shale.svc
        - shale-cluster.shale.svc.cluster.local
        - 10.1.2.73
        - 10.1.2.74
        - 10.1.2.75
      # Nodes of this cluster are adopted as they join; producers and
      # readers still wait for an operator (§33.4).
      auto_adopt: true
    audit:
      # The trail's retention (§26.5). The state directory here is a
      # Secret, so there is no volume for an archive: this keeps ninety
      # days and no copy. A deployment that must keep its evidence mounts
      # a volume and names it in `archive` instead of `discard`.
      retain: 2160h
      discard: true
