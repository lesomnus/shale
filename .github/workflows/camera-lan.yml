name: camera-lan

on:
  push:
    branches: [main]
    paths: ['deploy/edge/**', 'deploy/deb/**', 'deploy/systemd/**', 'docs/managed-edge.md', '.github/workflows/camera-lan.yml']
  pull_request:
    paths: ['deploy/edge/**', 'deploy/deb/**', 'deploy/systemd/**', 'docs/managed-edge.md', '.github/workflows/camera-lan.yml']

jobs:
  package-content:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Debian payload and packaged offline renderer
        # The content check stubs Go; application builds remain in the main CI.
        run: python3 -m unittest discover -s deploy/deb -p 'test_*.py'
  isolated-dhcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: configuration validation
        run: python3 -m unittest discover -s deploy/edge -p 'test_*.py'
      - name: isolated DHCP protocol
        # Privilege is confined to a disposable container with no external
        # network or host filesystem mounts. It creates only new namespaces.
        run: |
          docker build -t shale-camera-lan-test -f deploy/edge/test.Dockerfile deploy/edge
          docker run --rm --network=none --privileged shale-camera-lan-test
      - name: isolated topology coordinator contract
        run: docker run --rm --network=none --privileged shale-camera-lan-test python3 topology_test.py
