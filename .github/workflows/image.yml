# The image (§34.8) on ghcr.io/lesomnus/shale, for deployments that pull
# rather than build, in docker-bake.hcl's two steps:
#
#   build    one builder cross-compiles both binaries into ./output
#   package  ./output copied onto distroless for linux/amd64 and linux/arm64
#            (a Raspberry Pi producer runs the same binary) -- no compiler,
#            no QEMU
#
# Every push to main pushes two tags:
#
#   edge         the tip of main, moving
#   <sha>        that commit, never moved
#
# A deployment pins the digest; `crane digest ghcr.io/lesomnus/shale:<sha>`
# names it, and the `org.opencontainers.image.revision` label says which
# commit a digest is. A pull request touching the build runs both steps and
# pushes nothing.
name: image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/image.yml
      - .dockerignore
      - Dockerfile
      - docker-bake.hcl
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The same string deploy/deb/build.sh stamps, so a node reports the same
      # version whichever way it was installed.
      - name: Version
        run: echo "VERSION=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        uses: docker/bake-action@v6
        with:
          source: .
          targets: build
          set: |
            build.cache-from=type=gha
            build.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        uses: docker/bake-action@v6
        with:
          source: .
          targets: package
          set: |
            package.output=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'type=registry' || 'type=cacheonly' }}
