name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: download integrity checks
        run: python3 .github/scripts/test_fetch_tool.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shale-ci-tools
          key: shale-ci-buf-linux-amd64-1.72.0-8720830e26a733da
      - name: pinned generation tool
        # Same Buf release and SHA as the pinned Payday tool. Retry only HTTP
        # transport; an actual generation difference must fail on its first run.
        # Official v1.72.0 buf-Linux-x86_64 release asset; the API download route
        # avoids the release-page route that repeatedly returned HTTP 504.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh .github/scripts/fetch-tool.sh \
            https://api.github.com/repos/bufbuild/buf/releases/assets/480772580 \
            8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af \
            "$RUNNER_TEMP/shale-ci-tools/buf"
          echo "PD_BUF=$RUNNER_TEMP/shale-ci-tools/buf" >> "$GITHUB_ENV"
      - name: generation is in step
        run: go tool pd gen --check .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: console
        # The page the control plane embeds (§40.4): type-checked and built,
        # so what `go build` embeds below is a real one.
        run: cd ts && npm ci --no-audit --no-fund && npm run build && node test/sei.mjs
      - name: build
        run: go build ./...
      - name: sandbox compiles
        # The control plane as the page runs it (§40.3); nothing else builds
        # for js/wasm.
        run: GOOS=js GOARCH=wasm go build -tags grpcnotrace -o /dev/null ./wasm
      - name: vet
        run: go vet ./...
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shale-ffmpeg
          key: shale-ci-ffmpeg-btbn-n8.1.3-linux64-41e9c565594c3906
      - name: ffmpeg
        # The producer's live helper and its audio fallback run ffmpeg
        # (§38.3, §38.7); the tests that need it skip without it. A pinned
        # static build, not apt: when the runner could not resolve the Ubuntu
        # mirrors, apt spent an hour per job trying every package on each.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/ffmpeg.sh "$RUNNER_TEMP/shale-ffmpeg"
      - name: test
        # The e2e harness writes directory sinks, whose records are user
        # xattrs (§23.1): an ext4 image on a loop device has them wherever
        # the runner's kernel stands on tmpfs.
        run: |
          fallocate -l 2G /tmp/shale.img && mkfs.ext4 -q -F /tmp/shale.img
          sudo mkdir -p /mnt/shale-tmp && sudo mount -o loop,user_xattr /tmp/shale.img /mnt/shale-tmp
          sudo chmod 1777 /mnt/shale-tmp
          TMPDIR=/mnt/shale-tmp go test ./... -count=1 -timeout 45m
  # The tests whose goroutines meet, under the race detector. The test job
  # cannot see a race, since a test checks what it ends with: the producer's
  # heartbeat, stall watch and negotiations shared a source with its capture
  # loop without a lock through every run of it, and -race failed every
  # end-to-end test that runs a producer on its first run.
  #
  # Every package but internal/e2e: internal/producer's own tests run its
  # loops at once against a fake control plane, its uploader for several
  # sources at once, and its relay stream ended while it sends. And of
  # internal/e2e, whose seventeen minutes would make this the slowest job,
  # the tests that run a producer against the whole stack, but the drills
  # that spend a minute or more waiting out a restart, a failover or an
  # outage. These wait more than they compute, so the detector hardly
  # slows them, but there are many: about twenty-five minutes, beside the
  # test job, under a limit of forty.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shale-ffmpeg
          key: shale-ci-ffmpeg-btbn-n8.1.3-linux64-41e9c565594c3906
      - name: ffmpeg
        # The capture tests, which read the process's stderr beside its
        # stream, and the live helper's. The same pinned build as the test job.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/ffmpeg.sh "$RUNNER_TEMP/shale-ffmpeg"
      - name: test
        # The sinks' user xattrs, as in the test job; the test binaries are
        # built beside it, since race-built they outgrow its two gigabytes.
        run: |
          fallocate -l 2G /tmp/shale.img && mkfs.ext4 -q -F /tmp/shale.img
          sudo mkdir -p /mnt/shale-tmp && sudo mount -o loop,user_xattr /tmp/shale.img /mnt/shale-tmp
          sudo chmod 1777 /mnt/shale-tmp
          export TMPDIR=/mnt/shale-tmp GOTMPDIR=$RUNNER_TEMP
          go test -race -count=1 -timeout 20m $(go list ./... | grep -v '/internal/e2e$')
          e2e='ProducerRecords|PushedSources|DarkSkip|ProducerDown'
          e2e+='|Live|LiveAlways|LiveNack|LivePacing|LiveWall'
          e2e+='|RelayRestart|ControlPlaneDownWhileWatching'
          e2e+='|DelegatedViewing|DelegatedViewingEveryPerson'
          e2e+='|CameraProvisioningRecordsAndResumes|CameraDerivedCeilingsRecord|CameraControl.*'
          e2e+='|CameraWorker.*|CameraCredential.*|CameraPolicy.*|CameraTransport.*'
          e2e+='|SourceCatalog.*|ProducerLifecycle.*|ProducerHistorical.*|ProducerApplication.*|ProducerManaged.*|LiveEpoch.*'
          e2e+='|Edge.*|Qualification.*|ReaderAgent.*'
          e2e+='|CaRollover.*|HTTP3.*'
          e2e+='|SatelliteUpload|SatelliteUploadOverTLS|SatelliteDiesMidUpload|SatelliteAutoFallsBack'
          e2e+='|SatelliteLive|SatelliteLiveAcrossLaminae|SatelliteLiveFallsBack|SatelliteLiveHelperStaysOnProducer|SatelliteLiveOverTLS'
          e2e+='|SatelliteAccepted|SatelliteAcceptedPassedThrough|SatelliteAcceptedLost|SatelliteAcceptedFeedsLive|SatelliteDelegatedCalls'
          e2e+='|SatelliteServeAll'
          go test -race -count=1 -timeout 45m -run "^Test($e2e)\$" ./internal/e2e/
  # The end-to-end tests on PostgreSQL, the database the deployments run on
  # (deploy/k8s, the same image), where the others run on SQLite: a row
  # lock that exists only there (FOR SHARE), a statement the two plan
  # differently, a migration, the LISTEN/NOTIFY broker and the leader
  # lease. The whole of internal/e2e, since every control plane its tests
  # start takes SHALE_E2E_DB_DSN (start, startTLS, rolloverControl,
  # cameraTLSControl), and so will a test added that starts one; and cli,
  # whose concurrent migration runs only on PostgreSQL. About as long as the
  # e2e package takes in the test job, and beside it.
  #
  # One database for all of it: each control plane the harness starts
  # empties the schema first (drop schema public cascade), so the tests are
  # kept apart by running one at a time, which they do, none being
  # parallel, and the two packages one after the other, never at once.
  #
  # PostgreSQL is started here and not as a service, because it needs a
  # flag a service cannot be given: max_connections of 1000, not 100. The
  # postgres broker of payday (watchpg) has no way to be stopped, so every
  # server built with it keeps its listening connection and its publishing
  # one open after it is closed, for the rest of the process: two for each
  # `init` and each `serve all` of every test, which reached the hundred a
  # third of the way into the suite, and every test after it failed with
  # "too many clients" (an issue to be filed: payday's watchpg broker and
  # shale's Server.Close leave the broker's connections open). When they
  # close, this goes back to the default.
  #
  # The steps run on the runner, so the database is at localhost on the
  # mapped port. Readiness is asked over TCP: while the image initializes
  # the database its server listens on the socket alone, and it listens on
  # TCP only once it is the server that stays.
  postgres:
    runs-on: ubuntu-latest
    steps:
      - name: postgresql
        # Started first, so it initializes while the rest is set up.
        run: |
          docker run -d --name shale-postgres -p 5432:5432 \
            -e POSTGRES_USER=shale -e POSTGRES_PASSWORD=shale -e POSTGRES_DB=shale_e2e \
            postgres:17-alpine -c max_connections=1000
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/shale-ffmpeg
          key: shale-ci-ffmpeg-btbn-n8.1.3-linux64-41e9c565594c3906
      - name: ffmpeg
        # The producer's tests, which write under concurrency, skip without
        # it. The same pinned build as the test job.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/ffmpeg.sh "$RUNNER_TEMP/shale-ffmpeg"
      - name: postgresql is ready
        timeout-minutes: 2
        run: |
          until docker exec shale-postgres pg_isready -q -h 127.0.0.1 -p 5432 -U shale -d shale_e2e; do
            if [ "$(docker inspect -f '{{.State.Running}}' shale-postgres)" != true ]; then
              docker logs shale-postgres
              exit 1
            fi
            sleep 1
          done
          docker exec shale-postgres psql -U shale -d shale_e2e -Atc 'show max_connections'
      - name: test
        # The sinks' user xattrs, as in the test job.
        env:
          SHALE_E2E_DB_DSN: postgres://shale:shale@localhost:5432/shale_e2e?sslmode=disable
        run: |
          fallocate -l 2G /tmp/shale.img && mkfs.ext4 -q -F /tmp/shale.img
          sudo mkdir -p /mnt/shale-tmp && sudo mount -o loop,user_xattr /tmp/shale.img /mnt/shale-tmp
          sudo chmod 1777 /mnt/shale-tmp
          export TMPDIR=/mnt/shale-tmp
          go test -count=1 -timeout 10m ./cli
          go test -count=1 -timeout 60m ./internal/e2e
      - name: postgresql's log
        if: failure()
        run: docker logs --tail 200 shale-postgres
  package:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: debian package
        # build.sh builds the console into the binary when npm is there.
        run: deploy/deb/build.sh 0.0.0+${GITHUB_SHA::7} ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shale-deb-${{ matrix.arch }}
          path: dist/*.deb
