name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: generation is in step
        run: go tool pd gen --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: console
        # The page the control plane embeds (§40.4): type-checked and built,
        # so what `go build` embeds below is a real one.
        run: cd ts && npm ci --no-audit --no-fund && npm run build
      - name: build
        run: go build ./...
      - name: sandbox compiles
        # The control plane as the page runs it (§40.3); nothing else builds
        # for js/wasm.
        run: GOOS=js GOARCH=wasm go build -tags grpcnotrace -o /dev/null ./wasm
      - name: vet
        run: go vet ./...
      - name: ffmpeg
        # The producer's live helper and its audio fallback run ffmpeg
        # (§38.3, §38.7); the tests that need it skip without it.
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: test
        # The e2e harness writes directory sinks, whose records are user
        # xattrs (§23.1): an ext4 image on a loop device has them wherever
        # the runner's kernel stands on tmpfs.
        run: |
          fallocate -l 2G /tmp/shale.img && mkfs.ext4 -q -F /tmp/shale.img
          sudo mkdir -p /mnt/shale-tmp && sudo mount -o loop,user_xattr /tmp/shale.img /mnt/shale-tmp
          sudo chmod 1777 /mnt/shale-tmp
          TMPDIR=/mnt/shale-tmp go test ./... -count=1 -timeout 20m
  package:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: debian package
        # build.sh builds the console into the binary when npm is there.
        run: deploy/deb/build.sh 0.0.0+${GITHUB_SHA::7} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: shale-deb-${{ matrix.arch }}
          path: dist/*.deb
